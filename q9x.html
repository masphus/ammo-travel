<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Black Gold</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#000;color:#fff;max-width:520px;margin:auto;min-height:100vh;padding-bottom:90px}
.top{padding:22px 20px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font-size:26px;color:#E8C86A;font-weight:800;line-height:1.1}
.top small{font-size:13px;color:#aaa;font-weight:400}
.btn-keluar{width:44px;height:44px;border-radius:50%;background:#2a0d0d;border:1.5px solid #ff6b81;color:#ff6b81;font-size:19px;cursor:pointer;flex-shrink:0}
.garis{height:1px;background:linear-gradient(90deg,transparent,#D4AF37,transparent);margin:10px 20px 14px}
.stat{display:flex;gap:10px;margin:0 20px;flex-wrap:wrap}
.stat div{flex:1;min-width:100px;background:#0d0d0d;border:1px solid #D4AF37;border-radius:12px;padding:12px;text-align:center}
.stat b{font-size:20px;color:#E8C86A;display:block}
.stat small{color:#aaa;font-size:12px}
.tabs{display:flex;gap:8px;margin:16px 20px 0;flex-wrap:wrap}
.tabs button{flex:1;min-width:80px;padding:11px 6px;border-radius:10px;font-weight:800;cursor:pointer;border:1px solid #D4AF37;background:#111;color:#E8C86A;font-size:13px}
.tabs button.aktif{background:linear-gradient(180deg,#F5D67B,#D4AF37);color:#000}
h3{padding:18px 20px 10px;color:#E8C86A;font-size:18px}
.card{margin:0 20px 10px;background:#0d0d0d;border:1px solid #D4AF37;border-left:4px solid #D4AF37;border-radius:12px;padding:14px}
.card b{font-size:15px}
.card small{color:#aaa;font-size:13px;line-height:1.5}
.saldo{font-size:18px;color:#E8C86A;font-weight:800;margin:6px 0}
.row-btn{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row-btn button{flex:1;padding:10px 6px;border-radius:8px;font-weight:800;cursor:pointer;border:none;font-size:13px;min-width:80px}
.btn-topup{background:linear-gradient(180deg,#F5D67B,#D4AF37);color:#000}
.btn-kurang{background:#222;color:#ff6b81;border:1px solid #ff6b81!important}
.btn-reset{background:#111;color:#888;border:1px solid #444!important}
.btn-terima{background:#1a2a1a;color:#4CAF50;border:1px solid #4CAF50!important}
.btn-tolak{background:#2a0d0d;color:#ff6b81;border:1px solid #ff6b81!important}
.badge{display:inline-block;background:#5a4310;color:#E8C86A;font-size:11px;padding:4px 8px;border-radius:6px;font-weight:700}
.badge.outline{background:#222;color:#888;border:1px solid #444}
.empty{margin:0 20px;text-align:center;color:#777;padding:14px;border:1px dashed #333;border-radius:10px;font-size:13px;line-height:1.5}
.riwayat{margin:0 20px 10px;background:#111;border:1px dashed #444;border-radius:10px;padding:12px;font-size:13px;line-height:1.6}
.riwayat b{color:#E8C86A}
.riwayat .plus{color:#4CAF50;font-weight:800}
.riwayat .minus{color:#ff6b81;font-weight:800}
.riwayat small{color:#888}
.cari{margin:0 20px}
.cari input{width:100%;background:#111;border:1px solid #D4AF37;border-radius:10px;padding:12px;color:#fff;outline:none;font-size:14px}
#loading{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99;color:#D4AF37;flex-direction:column;gap:10px;text-align:center;padding:20px}
#loading button{background:#D4AF37;border:none;padding:10px 18px;border-radius:10px;font-weight:800;cursor:pointer;display:none}
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(3px);z-index:200;display:none;align-items:flex-end;justify-content:center}
.popup-overlay.show{display:flex}
.popup-card{background:#111;border:1px solid #D4AF37;border-bottom:none;border-radius:22px 22px 0 0;width:100%;max-width:520px;padding:22px 20px 26px;max-height:92vh;overflow-y:auto}
.popup-card h2{font-size:19px;color:#E8C86A;margin-bottom:8px}
.popup-card p{font-size:14px;color:#ccc;line-height:1.5;white-space:pre-line}
.popup-card input{width:100%;margin-top:14px;background:#000;border:1px solid #D4AF37;border-radius:10px;padding:13px;color:#fff;font-size:16px;outline:none}
.popup-btns{display:flex;gap:10px;margin-top:18px}
.popup-btns button{flex:1;padding:13px;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;border:none}
.btn-emas{background:linear-gradient(180deg,#F5D67B,#D4AF37);color:#000}
.btn-gelap{background:#222;color:#ccc;border:1px solid #444!important}
.chip-topup{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip-topup button{background:#111;border:1px solid #D4AF37;color:#E8C86A;padding:8px 12px;border-radius:20px;cursor:pointer;font-weight:700;font-size:13px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#000;border-top:1px solid #D4AF37;display:flex;justify-content:space-around;padding:10px 0 14px;z-index:50}
.nav a{text-align:center;color:#888;text-decoration:none;font-size:12px}
.nav a.aktif{color:#E8C86A}
.nav span{display:block;font-size:22px}
#topupModal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#topupModal.show{display:flex}
.topup-box{background:#111;border:2px solid #D4AF37;border-radius:18px;padding:22px;width:100%;max-width:400px}
.topup-box h3{padding:0 0 10px;color:#E8C86A}
.topup-box p{color:#ccc;font-size:13px;line-height:1.6}
.topup-box input{width:100%;padding:13px;background:#000;border:1px solid #D4AF37;border-radius:10px;color:#fff;font-size:16px;outline:none;margin-top:12px}
</style>
</head>
<body>
<div id="loading"><div id="loadingTxt">👻 Mengecek karcis admin...</div><button id="btnBalik" onclick="keIndex()">⬅ Balik ke Beranda</button></div>

<div class="top"><h1>Admin<br><small id="adminNama">Black Gold</small></h1><button class="btn-keluar" onclick="logout()" title="Keluar">🚪</button></div>
<div class="garis"></div>

<div class="stat">
  <div><b id="statDriver">0</b><small>Driver</small></div>
  <div><b id="statPenumpang">0</b><small>Penumpang</small></div>
  <div><b id="statOrder">0</b><small>Order</small></div>
  <div><b id="statTotalSaldo">Rp 0</b><small>Total Saldo</small></div>
</div>

<div class="tabs">
  <button id="tabDriver" class="aktif" onclick="gantiTab('driver')">🚗 Driver</button>
  <button id="tabPenumpang" onclick="gantiTab('penumpang')">🧍 Penumpang</button>
  <button id="tabOrder" onclick="gantiTab('order')">📋 Order</button>
  <button id="tabRiwayat" onclick="gantiTab('riwayat')">🧾 Riwayat Top Up</button>
</div>

<div id="wrapList">
  <h3 id="judulList">🚗 Daftar Driver</h3>
  <div class="cari"><input id="inputCari" placeholder="🔍 Cari nama / code / WA / plat..." oninput="renderList()"></div>
  <div id="list" style="margin-top:10px"></div>
</div>

<div id="wrapRiwayat" style="display:none">
  <h3>🧾 Riwayat Top Up</h3>
  <div id="listRiwayat"></div>
</div>

<div class="nav">
  <a href="#" class="aktif"><span>🏠</span>Beranda</a>
  <a href="#" onclick="gantiTab('driver');return false;"><span>🚗</span>Driver</a>
  <a href="#" onclick="gantiTab('penumpang');return false;"><span>🧍</span>Penumpang</a>
  <a href="#" onclick="logout();return false;"><span>🚪</span>Keluar</a>
</div>

<div id="popupOverlay" class="popup-overlay"><div class="popup-card"><h2 id="popupJudul">Ammo Travel</h2><p id="popupPesan"></p><div id="popupChip"></div><input id="popupInput" style="display:none"><div class="popup-btns" id="popupBtns"></div></div></div>

<div id="topupModal"><div class="topup-box">
  <h3 id="topupJudul">💰 Top Up Saldo</h3>
  <p id="topupInfo"></p>
  <div class="chip-topup">
    <button type="button" onclick="isiNominalTopUp(20000)">20rb</button>
    <button type="button" onclick="isiNominalTopUp(50000)">50rb</button>
    <button type="button" onclick="isiNominalTopUp(100000)">100rb</button>
    <button type="button" onclick="isiNominalTopUp(200000)">200rb</button>
    <button type="button" onclick="isiNominalTopUp(500000)">500rb</button>
  </div>
  <input id="topupNominal" type="number" inputmode="numeric" placeholder="Mau isi berapa? contoh: 50000">
  <div class="popup-btns"><button class="btn-gelap" onclick="tutupTopUp()">Batal</button><button class="btn-emas" onclick="simpanTopUp()">💾 Simpan Saldo</button></div>
</div></div>

<script>
const SUPABASE_URL = 'https://xxtgmohxdztesiubfxap.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cSeSerPzGTtFmnVOwKq97w_slkG9Hiv';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let tabAktif='driver', cacheDrivers=[], cachePenumpang=[], cacheBookings=[], cacheRiwayat=[], currentAdmin=null, adminNama='Admin', topupTarget=null;
function rp(n){ return 'Rp ' + (Number(n)||0).toLocaleString('id-ID'); }
function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return String(s ?? '').replace(/"/g,'').replace(/'/g,''); }
function fmtTanggal(v){ if(!v) return '-'; try{ return new Date(v).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return String(v); } }
function notify(msg){ popupAlert(msg); }
function keIndex(){ try{ localStorage.removeItem('ammo_admin_token'); localStorage.removeItem('ammo_driver_token'); sessionStorage.removeItem('ammo_admin_token'); sessionStorage.removeItem('ammo_driver_token'); }catch(e){} window.location.replace('index.html'); }
function gagal(msg){ var t=document.getElementById('loadingTxt'); if(t) t.textContent=msg; var b=document.getElementById('btnBalik'); if(b) b.style.display='block'; }
function getSaldoObj(o){ return Number(o.saldo ?? o.saldo_emas ?? o.saldo_voucher ?? 0)||0; }
function tutupPopup(){ document.getElementById('popupOverlay').classList.remove('show'); }
function showPopup(judul, pesan, opts){
  return new Promise(function(resolve){
    var ov=document.getElementById('popupOverlay');
    document.getElementById('popupJudul').textContent=judul||'Ammo Travel';
    document.getElementById('popupPesan').textContent=pesan||'';
    var chip=document.getElementById('popupChip'); chip.innerHTML='';
    if(opts && opts.chips){
      var wrap=document.createElement('div'); wrap.className='chip-topup';
      opts.chips.forEach(function(c){ var b=document.createElement('button'); b.type='button'; b.textContent=c.label; b.onclick=function(){ document.getElementById('popupInput').value=c.value; }; wrap.appendChild(b); });
      chip.appendChild(wrap);
    }
    var inp=document.getElementById('popupInput');
    var isInput = opts && opts.input;
    inp.style.display = isInput ? 'block' : 'none';
    inp.value = (opts && opts.value) || '';
    inp.placeholder = (opts && opts.placeholder) || '';
    inp.type = (opts && opts.inputType) || 'text';
    inp.inputMode = (opts && opts.inputType==='number') ? 'numeric' : 'text';
    var btns=document.getElementById('popupBtns'); btns.innerHTML='';
    function selesai(v){ tutupPopup(); resolve(v); }
    if(opts && opts.confirm){
      var b1=document.createElement('button'); b1.className='btn-gelap'; b1.textContent=opts.batalText||'Batal'; b1.onclick=function(){ selesai(false); };
      var b2=document.createElement('button'); b2.className='btn-emas'; b2.textContent=opts.okText||'Ya, Lanjut'; b2.onclick=function(){ selesai(isInput ? inp.value : true); };
      btns.appendChild(b1); btns.appendChild(b2);
    } else {
      var b=document.createElement('button'); b.className='btn-emas'; b.textContent=(opts && opts.okText)||'Oke'; b.onclick=function(){ selesai(isInput ? inp.value : true); };
      btns.appendChild(b);
    }
    ov.classList.add('show');
    if(isInput) setTimeout(function(){ inp.focus(); },100);
  });
}
async function popupAlert(pesan,judul){ await showPopup(judul||'Ammo Travel',pesan,{}); }
async function popupConfirm(pesan,judul){ return await showPopup(judul||'Konfirmasi',pesan,{confirm:true}); }
function bacaKarcis(){
  var tok=''; try{ tok=localStorage.getItem('ammo_admin_token')||localStorage.getItem('ammo_driver_token')||sessionStorage.getItem('ammo_admin_token')||''; }catch(e){}
  if(!tok) return null;
  var p=String(tok).split('|'); if(p.length<3) return null;
  return {codeVal:String(p[0]||'').replace(/^[#@]+/,'').toLowerCase().trim(), pinVal:String(p[1]||'').trim(), exp:Number(p[2]||0)};
}
async function cekAkses(){
  var k=bacaKarcis();
  if(!k || Date.now()>k.exp){ gagal('Karcis admin kadaluarsa. Login lagi dari beranda ya.'); return; }
  var hasil=null;
  try{ var r=await sb.rpc('cek_pin_login',{p_code:k.codeVal,p_pin:k.pinVal}); if(r&&!r.error&&r.data&&r.data.length){ var list=Array.isArray(r.data)?r.data:[r.data]; hasil=list.find(function(x){return String(x.role||'').toLowerCase()==='admin';})||null; } }catch(e){}
  if(!hasil){ try{ var a=await sb.from('admin').select('*').ilike('code',k.codeVal).maybeSingle(); if(a&&a.data&&String(a.data.pin)===String(k.pinVal)) hasil=a.data; }catch(e){} }
  if(!hasil){ gagal('Code / PIN admin tidak ketemu di database.'); return; }
  currentAdmin=hasil; adminNama=hasil.nama||hasil.email||'Admin';
  document.getElementById('adminNama').textContent=adminNama+' • Admin';
  document.getElementById('loading').style.display='none';
  loadAll();
  try{
    sb.channel('admin-realtime')
      .on('postgres_changes',{event:'*',schema:'public',table:'drivers'},function(){ loadAll(); })
      .on('postgres_changes',{event:'*',schema:'public',table:'penumpang'},function(){ loadAll(); })
      .on('postgres_changes',{event:'*',schema:'public',table:'bookings'},function(){ loadAll(); })
      .on('postgres_changes',{event:'*',schema:'public',table:'topup_riwayat'},function(){ loadRiwayat(); })
      .subscribe();
  }catch(e){}
}
function gantiTab(t){
  tabAktif=t;
  document.getElementById('tabDriver').classList.toggle('aktif', t==='driver');
  document.getElementById('tabPenumpang').classList.toggle('aktif', t==='penumpang');
  document.getElementById('tabOrder').classList.toggle('aktif', t==='order');
  document.getElementById('tabRiwayat').classList.toggle('aktif', t==='riwayat');
  document.getElementById('wrapList').style.display = t==='riwayat' ? 'none' : 'block';
  document.getElementById('wrapRiwayat').style.display = t==='riwayat' ? 'block' : 'none';
  document.getElementById('judulList').textContent = t==='driver' ? '🚗 Daftar Driver' : t==='penumpang' ? '🧍 Daftar Penumpang' : '📋 Daftar Order';
  if(t==='riwayat') loadRiwayat(); else renderList();
}
async function loadAll(){
  try{ var r=await sb.from('drivers').select('*').order('created_at',{ascending:false}); if(r&&r.data) cacheDrivers=r.data; }catch(e){}
  try{ var p=await sb.from('penumpang').select('*').order('created_at',{ascending:false}); if(p&&p.data) cachePenumpang=p.data; }catch(e){}
  try{ var b=await sb.from('bookings').select('*').order('created_at',{ascending:false}).limit(50); if(b&&b.data) cacheBookings=b.data; }catch(e){}
  var total=0; cacheDrivers.forEach(function(d){ total+=getSaldoObj(d); }); cachePenumpang.forEach(function(d){ total+=getSaldoObj(d); });
  document.getElementById('statDriver').textContent=cacheDrivers.length;
  document.getElementById('statPenumpang').textContent=cachePenumpang.length;
  document.getElementById('statOrder').textContent=cacheBookings.length;
  document.getElementById('statTotalSaldo').textContent=rp(total);
  if(tabAktif!=='riwayat') renderList();
}
async function loadRiwayat(){
  try{ var r=await sb.from('topup_riwayat').select('*').order('created_at',{ascending:false}).limit(30); if(r&&r.data) cacheRiwayat=r.data; }catch(e){ cacheRiwayat=[]; }
  var box=document.getElementById('listRiwayat');
  if(!cacheRiwayat.length){ box.innerHTML='<div class="empty">Belum ada riwayat top up.<br>Isi saldo 1x, langsung muncul di sini.</div>'; return; }
  box.innerHTML=cacheRiwayat.map(function(x){
    var isPlus=Number(x.nominal||0)>=0;
    return '<div class="riwayat"><b>'+esc(x.target_nama||'-')+'</b> • '+esc(x.tipe||'')+'<br><span class="'+(isPlus?'plus':'minus')+'">'+(isPlus?'+ ':'')+rp(x.nominal)+'</span> • Saldo '+rp(x.saldo_sebelum)+' → '+rp(x.saldo_sesudah)+'<br><small>oleh '+esc(x.admin_nama||'Admin')+' • '+fmtTanggal(x.created_at)+'</small></div>';
  }).join('');
}
function renderList(){
  var box=document.getElementById('list');
  var cari=(document.getElementById('inputCari').value||'').toLowerCase().trim();
  if(tabAktif==='driver'){
    var list=cacheDrivers.filter(function(d){ if(!cari) return true; return String(d.nama||'').toLowerCase().includes(cari) || String(d.code||'').toLowerCase().includes(cari) || String(d.no_wa||d.no_hp||'').includes(cari) || String(d.plat_mobil||d.plat||'').toLowerCase().includes(cari); });
    if(!list.length){ box.innerHTML='<div class="empty">Belum ada driver.<br>Coba cari nama lain, atau driver belum daftar.</div>'; return; }
    box.innerHTML=list.map(function(d){
      var isPending=['menunggu','pending'].includes(String(d.status||'').toLowerCase());
      var btnVerif=isPending ? '<button class="btn-terima" onclick="verifikasiDriver('+Number(d.id)+',\'aktif\')">Terima</button> <button class="btn-tolak" onclick="verifikasiDriver('+Number(d.id)+',\'ditolak\')">Tolak</button>' : '<button class="btn-tolak" onclick="hapusDriver('+Number(d.id)+')">Hapus</button>';
      return '<div class="card"><b>'+esc(d.nama||'Driver')+'</b><br><small>Code: #'+esc(d.code||'-')+' • PIN: '+esc(d.pin||'-')+'<br>'+esc(d.jenis_mobil||d.jenis_kendaraan||'-')+' • '+esc(d.plat_mobil||d.plat||'-')+'<br>WA: '+esc(d.no_wa||d.no_hp||d.telp||'-')+'</small><div><span class="badge '+(d.status==='aktif'?'':'outline')+'">'+esc(d.status||'Aktif')+'</span></div><div class="saldo">Saldo: '+rp(getSaldoObj(d))+'</div><div class="row-btn"><button class="btn-topup" onclick="bukaTopUp(\'driver\',\''+escAttr(d.id)+'\')">+ Top Up</button><button class="btn-kurang" onclick="kurangiSaldoCepat(\'driver\',\''+escAttr(d.id)+'\')">- Kurangi</button><button class="btn-reset" onclick="resetSaldo(\'driver\',\''+escAttr(d.id)+'\')">Reset 0</button></div><div class="row-btn">'+btnVerif+'</div></div>';
    }).join('');
  } else if(tabAktif==='penumpang'){
    var list2=cachePenumpang.filter(function(d){ if(!cari) return true; return String(d.nama||'').toLowerCase().includes(cari) || String(d.no_wa||'').includes(cari) || String(d.google_email||'').toLowerCase().includes(cari); });
    if(!list2.length){ box.innerHTML='<div class="empty">Belum ada penumpang.<br>Penumpang muncul otomatis setelah daftar di beranda (WA / Google).</div>'; return; }
    box.innerHTML=list2.map(function(d){
      var jml=cacheBookings.filter(function(o){ return String(o.penumpang_id)===String(d.id); }).length;
      return '<div class="card"><b>'+esc(d.nama||'Penumpang')+'</b><br><small>WA: '+esc(d.no_wa||'-')+' • '+esc(d.google_email||d.email||'-')+'<br>Via: '+esc(d.via||'-')+' • '+jml+' booking • Status: '+esc(d.status||'Aktif')+'</small><div class="saldo">Saldo Voucher: '+rp(getSaldoObj(d))+'</div><div class="row-btn"><button class="btn-topup" onclick="bukaTopUp(\'penumpang\',\''+escAttr(d.id)+'\')">+ Top Up</button><button class="btn-kurang" onclick="kurangiSaldoCepat(\'penumpang\',\''+escAttr(d.id)+'\')">- Kurangi</button><button class="btn-reset" onclick="resetSaldo(\'penumpang\',\''+escAttr(d.id)+'\')">Reset 0</button></div></div>';
    }).join('');
  } else {
    if(!cacheBookings.length){ box.innerHTML='<div class="empty">Belum ada order.</div>'; return; }
    var list3=cacheBookings.filter(function(o){ if(!cari) return true; return String(o.pickup||'').toLowerCase().includes(cari) || String(o.tujuan||'').toLowerCase().includes(cari) || String(o.status||'').toLowerCase().includes(cari); });
    box.innerHTML=list3.map(function(o){
      return '<div class="card"><b>Order #'+esc(String(o.kode||o.id).slice(0,6).toUpperCase())+' • '+esc(o.status||'-')+'</b><br><small>📍 '+esc(o.pickup||'-')+' → '+esc(o.tujuan||'-')+'<br>💰 '+rp(o.harga||o.tarif||0)+' • '+fmtTanggal(o.created_at)+'</small></div>';
    }).join('');
  }
}
/* ===== SALDO - NYAMBUNG KE DATABASE ===== */
function isiNominalTopUp(n){ try{ document.getElementById('topupNominal').value=n; }catch(e){} }
function tutupTopUp(){ document.getElementById('topupModal').classList.remove('show'); topupTarget=null; }
function bukaTopUp(tipe, id){
  var d = tipe==='driver' ? cacheDrivers.find(function(x){ return String(x.id)===String(id); }) : cachePenumpang.find(function(x){ return String(x.id)===String(id); });
  if(!d){ notify('Data tidak ketemu, refresh dulu ya'); return; }
  topupTarget={tipe:tipe, id:d.id, nama:d.nama||'User', sebelum:getSaldoObj(d)};
  document.getElementById('topupJudul').textContent='💰 Top Up '+(tipe==='driver'?'Driver':'Penumpang');
  document.getElementById('topupInfo').innerHTML='Buat <b style="color:#f5d67b">'+esc(topupTarget.nama)+'</b><br>Saldo sekarang: <b style="color:#f5d67b">'+rp(topupTarget.sebelum)+'</b><br>Diisi admin: <b>'+esc(adminNama)+'</b>';
  document.getElementById('topupNominal').value='';
  document.getElementById('topupModal').classList.add('show');
  setTimeout(function(){ try{ document.getElementById('topupNominal').focus(); }catch(e){} },100);
}
async function simpanSaldoKeDB(tipe, id, saldoBaru){
  var tabel = tipe==='driver' ? 'drivers' : 'penumpang';
  var payload = tipe==='driver' ? {saldo:saldoBaru, saldo_emas:saldoBaru} : {saldo:saldoBaru, saldo_emas:saldoBaru, saldo_voucher:saldoBaru};
  var r = await sb.from(tabel).update(payload).eq('id', id);
  if(r && !r.error) return true;
  var keys=Object.keys(payload);
  for(var i=0;i<keys.length;i++){
    var satu={}; satu[keys[i]]=saldoBaru;
    var r2=await sb.from(tabel).update(satu).eq('id', id);
    if(r2 && !r2.error) return true;
  }
  console.warn('simpanSaldo gagal', r && r.error);
  return false;
}
async function catatRiwayatTopUp(tipe, targetId, targetNama, nominal, sebelum, sesudah){
  try{ await sb.from('topup_riwayat').insert([{tipe:tipe, target_id:String(targetId), target_nama:targetNama, nominal:nominal, saldo_sebelum:sebelum, saldo_sesudah:sesudah, admin_nama:adminNama}]); }catch(e){}
}
async function simpanTopUp(){
  if(!topupTarget) return;
  var nominal=Number(String(document.getElementById('topupNominal').value||'').replace(/[^0-9]/g,''));
  if(!nominal || nominal<=0){ notify('Isi nominal dulu bro'); return; }
  var sesudah=topupTarget.sebelum+nominal;
  var ok=await simpanSaldoKeDB(topupTarget.tipe, topupTarget.id, sesudah);
  if(!ok){ notify('Gagal simpan! Jalanin SQL saldo dulu di Supabase'); return; }
  await catatRiwayatTopUp(topupTarget.tipe, topupTarget.id, topupTarget.nama, nominal, topupTarget.sebelum, sesudah);
  var arr=topupTarget.tipe==='driver' ? cacheDrivers : cachePenumpang;
  var d=arr.find(function(x){ return String(x.id)===String(topupTarget.id); });
  if(d){ d.saldo=sesudah; d.saldo_emas=sesudah; d.saldo_voucher=sesudah; }
  tutupTopUp();
  notify('Berhasil! Saldo '+topupTarget.nama+' jadi '+rp(sesudah));
  loadAll();
}
async function kurangiSaldoCepat(tipe, id){
  var d = tipe==='driver' ? cacheDrivers.find(function(x){ return String(x.id)===String(id); }) : cachePenumpang.find(function(x){ return String(x.id)===String(id); });
  if(!d) return;
  var val=await showPopup('Kurangi Saldo','Kurangi saldo '+(d.nama||'')+'\nSaldo sekarang: '+rp(getSaldoObj(d)),{input:true,inputType:'number',placeholder:'10000',okText:'- Kurangi',confirm:true});
  if(!val) return;
  var nominal=Number(String(val).replace(/[^0-9]/g,'')); if(!nominal) return;
  var sebelum=getSaldoObj(d); var sesudah=Math.max(0, sebelum-nominal);
  var ok=await simpanSaldoKeDB(tipe, d.id, sesudah);
  if(!ok){ notify('Gagal, jalanin SQL saldo dulu ya'); return; }
  await catatRiwayatTopUp(tipe, d.id, d.nama, -nominal, sebelum, sesudah);
  d.saldo=sesudah; d.saldo_emas=sesudah; d.saldo_voucher=sesudah;
  notify('Saldo dikurangi jadi '+rp(sesudah));
  loadAll();
}
async function resetSaldo(tipe, id){
  var d = tipe==='driver' ? cacheDrivers.find(function(x){ return String(x.id)===String(id); }) : cachePenumpang.find(function(x){ return String(x.id)===String(id); });
  if(!d) return;
  var sebelum=getSaldoObj(d);
  var ok=await popupConfirm('Reset saldo '+(d.nama||'User')+' dari '+rp(sebelum)+' jadi Rp 0 ?','Reset Saldo'); if(!ok) return;
  var berhasil=await simpanSaldoKeDB(tipe, d.id, 0);
  if(!berhasil){ notify('Gagal, jalanin SQL saldo dulu ya'); return; }
  await catatRiwayatTopUp(tipe, d.id, d.nama, -sebelum, sebelum, 0);
  d.saldo=0; d.saldo_emas=0; d.saldo_voucher=0;
  loadAll();
}
async function verifikasiDriver(id, statusBaru){
  var r=await sb.from('drivers').update({status:statusBaru}).eq('id', id);
  if(r && r.error){ notify('Gagal: '+r.error.message); return; }
  notify('Driver '+statusBaru);
  loadAll();
}
async function hapusDriver(id){
  var ok=await popupConfirm('Yakin hapus driver ini?','Hapus Driver'); if(!ok) return;
  var r=await sb.from('drivers').delete().eq('id', id);
  if(r && r.error){ notify('Gagal: '+r.error.message); return; }
  loadAll();
}
async function logout(){
  try{ document.getElementById('popupOverlay').classList.remove('show'); }catch(e){}
  try{ document.getElementById('topupModal').classList.remove('show'); }catch(e){}
  var ok=confirm('Yakin mau keluar dari Admin?');
  if(!ok) return;
  try{
    localStorage.removeItem('ammo_admin_token');
    localStorage.removeItem('ammo_driver_token');
    localStorage.removeItem('ammo_driver');
    localStorage.removeItem('ammo_driver_id');
    localStorage.removeItem('ammo_driver_nama');
    localStorage.removeItem('ammo_admin_nama');
    localStorage.removeItem('ammo_admin_email');
    localStorage.removeItem('ammo_role');
    sessionStorage.removeItem('ammo_admin_token');
    sessionStorage.removeItem('ammo_driver_token');
  }catch(e){}
  window.location.replace('index.html?t=' + Date.now());
}
document.getElementById('popupOverlay').addEventListener('click', function(e){ if(e.target.id==='popupOverlay') tutupPopup(); });
document.getElementById('topupModal').addEventListener('click', function(e){ if(e.target.id==='topupModal') tutupTopUp(); });
cekAkses();
</script>
