<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Penumpang - AMMO TRAVEL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#000;color:#fff}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#0a0a0a;padding:18px 16px 110px}
.logo{text-align:center;font-size:30px;font-weight:900;letter-spacing:2px;background:linear-gradient(180deg,#FFE9A8,#D4AF37,#9A7B1A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;padding:6px 0 2px}
h1{font-size:24px;margin:10px 4px 14px}
.card{border:1px solid #C9A227;border-radius:22px;padding:16px;background:#111}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #222;font-size:14px}
.row:last-child{border:none}
.row span{color:#aaa}
.row b{text-align:right;color:#fff}
.status{margin-top:14px;border:1px solid #C9A227;border-radius:18px;padding:16px;background:#111;text-align:center}
.spinner{width:40px;height:40px;border:4px solid #333;border-top:4px solid #D4AF37;border-radius:50%;margin:12px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.driverCard{margin-top:14px;border:1px solid #C9A227;border-radius:18px;padding:16px;background:#111;display:none}
.btn{width:100%;margin-top:14px;padding:16px;border:none;border-radius:14px;background:linear-gradient(180deg,#FFE9A8,#D4AF37);font-size:17px;font-weight:900;cursor:pointer}
.btn2{width:100%;margin-top:10px;padding:12px;border:1px solid #ff4d4d;background:transparent;color:#ff6b6b;border-radius:12px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<div class="logo">AMMO TRAVEL</div>
<h1>Mencari Driver...</h1>
<div class="card">
<div class="row"><span>Dari</span><b id="wDari">-</b></div>
<div class="row"><span>Tujuan</span><b id="wTujuan">-</b></div>
<div class="row"><span>Tanggal</span><b id="wTanggal">-</b></div>
<div class="row"><span>Jam Berangkat</span><b id="wJam">-</b></div>
<div class="row"><span>Jumlah Orang</span><b id="wOrang">-</b></div>
<div class="row"><span>Jarak</span><b id="wJarak">-</b></div>
<div class="row"><span>Estimasi</span><b id="wEstimasi">-</b></div>
<div class="row"><span>Total Harga</span><b id="wHarga" style="color:#E8C766">-</b></div>
</div>
<div class="status" id="boxCari">
<div class="spinner"></div>
<b id="txtStatus">MENCARI DRIVER...</b>
<p style="color:#aaa;font-size:13px;margin-top:6px">Driver terdekat lagi dicari, tunggu ya Kak</p>
</div>
<div class="driverCard" id="driverCard">
<b id="dNama" style="color:#E8C766;font-size:18px">-</b>
<p id="dMobil" style="color:#aaa;margin-top:6px">-</p>
<p id="dPlat" style="font-weight:900;margin-top:4px">-</p>
<p style="color:#4ade80;margin-top:8px;font-weight:800">● Driver OTW ke lokasi kamu</p>
</div>
<button class="btn" onclick="window.location.href='index.html'">KEMBALI KE BERANDA</button>
<button class="btn2" onclick="batal()">BATALKAN PESANAN</button>
</div>
<script>
const saved = JSON.parse(localStorage.getItem('ammo_penumpang') || localStorage.getItem('masphus_order') || '{}');
const fmt = n => 'Rp ' + Math.round(n||0).toLocaleString('id-ID');
function tampil(o){
  document.getElementById('wDari').textContent = o.asal_nama || o.dari || '-';
  document.getElementById('wTujuan').textContent = o.tujuan_nama || o.tujuan || '-';
  document.getElementById('wTanggal').textContent = o.tanggal || o.tanggal_berangkat || '-';
  document.getElementById('wJam').textContent = o.jam || o.jam_berangkat || '-';
  document.getElementById('wOrang').textContent = (o.jumlah_orang || o.orang || '-') + ' Orang';
  document.getElementById('wJarak').textContent = o.jarak_km ? Number(o.jarak_km).toFixed(1)+' km' : '-';
  document.getElementById('wEstimasi').textContent = o.estimasi || '-';
  document.getElementById('wHarga').textContent = fmt(o.total_harga || o.total || o.harga || 0);
}
tampil(saved);
const SUPABASE_URL = 'https://xxtgmohxdztesiubfxap.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cSeSerPzGTtFmnVOwKq97w_slkG9Hiv';
const orderId = saved.order_id || saved.id || localStorage.getItem('ammo_order_id');
async function cekDriver(){
  if(!orderId) return;
  try{
    let r = await fetch(SUPABASE_URL + '/rest/v1/orders?id=eq.' + orderId + '&select=*', {headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});
    let j = await r.json();
    let o = j && j[0];
    if(!o) return;
    tampil(o);
    if(o.status==='diterima' || o.status==='dijemput' || o.status==='jalan'){
      document.getElementById('boxCari').style.display='none';
      document.getElementById('driverCard').style.display='block';
      document.querySelector('h1').textContent = 'Driver Ditemukan!';
      document.getElementById('dNama').textContent = o.driver_code || 'Driver AMMO';
      document.getElementById('dMobil').textContent = 'Driver AMMO • OTW';
      document.getElementById('dPlat').textContent = o.driver_id ? 'ID Driver: '+o.driver_id : '';
      clearInterval(window._poll);
    }
    if(o.status==='ditolak' || o.status==='batal'){
      document.getElementById('txtStatus').textContent = 'Order ditolak / dibatalkan';
      clearInterval(window._poll);
    }
  }catch(e){}
}
if(orderId){ window._poll = setInterval(cekDriver, 3000); cekDriver(); }
function batal(){
  if(confirm('Batalkan pesanan ini?')){
    localStorage.removeItem('ammo_penumpang');
    localStorage.removeItem('masphus_order');
    window.location.href='index.html?cancelled=1';
  }
}
</script>
</body>
</html>
