<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesan Travel - Penumpang</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#0a0a0a;color:#fff;min-height:100vh}
.header{background:linear-gradient(135deg,#d4af37,#f5d76e);color:#000;padding:20px;text-align:center;font-weight:900;font-size:22px}
.container{max-width:480px;margin:0 auto;padding:16px}
.card{background:#1a1a1a;border:1px solid #d4af37;border-radius:16px;padding:16px;margin-bottom:14px}
label{font-size:13px;color:#d4af37;font-weight:bold}
input,select{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;font-size:15px}
button{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#d4af37,#f5d76e);color:#000;font-weight:900;font-size:16px;cursor:pointer}
.driver{background:#111;border:1px solid #333;border-radius:12px;padding:12px;margin-top:10px}
.driver b{color:#f5d76e}
.harga{font-size:22px;font-weight:900;color:#f5d76e;text-align:center;margin:10px 0}
.small{font-size:12px;color:#aaa;text-align:center}
.success{background:#0f3d1e;border:1px solid #2ecc71;padding:14px;border-radius:12px;text-align:center;display:none}
</style>
</head>
<body>
<div class="header">🚕 TRAVEL CIANJUR<br><span style="font-size:13px;font-weight:400">Pesan Travel - Penumpang</span></div>
<div class="container">
  <div class="card">
    <label>Nama Penumpang</label>
    <input id="nama" placeholder="Nama lengkap">
    <label>No WA</label>
    <input id="wa" placeholder="08xxxxxxxxxx">
    <label>Dari Lokasi (Jemput)</label>
    <input id="dari" placeholder="Cth: Cianjur Kota">
    <label>Ke Lokasi (Tujuan)</label>
    <input id="ke" placeholder="Cth: Bandung">
    <label>Jarak (KM) - isi perkiraan</label>
    <input id="jarak" type="number" value="30">
    <label>Jenis Layanan</label>
    <select id="layanan">
      <option value="REGULER">REGULER - Rp 3.500 / KM</option>
      <option value="EXPRESS">EXPRESS - Rp 5.000 / KM</option>
      <option value="CARTER">CARTER - Rp 7.000 / KM</option>
    </select>
    <label>Tanggal Berangkat</label>
    <input id="tanggal" type="date">
    <div class="harga" id="hargaText">Total: Rp 0</div>
    <button onclick="pesan()">PESAN SEKARANG</button>
    <p class="small" id="statusText">Menghubungkan ke Supabase...</p>
  </div>

  <div class="card">
    <b style="color:#d4af37">Driver Aktif</b>
    <div id="driverList">Memuat driver...</div>
  </div>

  <div class="success" id="suksesBox">
    ✅ Order Berhasil Terkirim!<br>
    <span id="suksesDetail" style="font-size:13px"></span>
  </div>
</div>

<script>
const SUPABASE_URL = "https://xxtgmohxdztesiubfxap.supabase.co";
const SUPABASE_KEY = "sb_publishable_cSeSerPzGTtFmnVOwKq97w_slkG9Hiv";
const HEADERS = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json",
  "Prefer": "return=representation"
};

function hitung(){
  const jarak = parseFloat(document.getElementById('jarak').value) || 0;
  const layanan = document.getElementById('layanan').value;
  let perKm = 3500;
  if(layanan==='EXPRESS') perKm=5000;
  if(layanan==='CARTER') perKm=7000;
  const total = jarak * perKm;
  document.getElementById('hargaText').innerText = "Total: Rp " + total.toLocaleString('id-ID');
  return total;
}
document.getElementById('jarak').addEventListener('input', hitung);
document.getElementById('layanan').addEventListener('change', hitung);
document.getElementById('tanggal').valueAsDate = new Date();
hitung();

async function loadDriver(){
  try{
    const res = await fetch(SUPABASE_URL + "/rest/v1/drivers?status=eq.aktif&select=*", {headers: HEADERS});
    const data = await res.json();
    document.getElementById('statusText').innerText = "Terhubung ✅ " + data.length + " driver aktif";
    if(!data.length){ document.getElementById('driverList').innerHTML = "Belum ada driver aktif"; return; }
    document.getElementById('driverList').innerHTML = data.map(d=>`
      <div class="driver"><b>${d.nama}</b> - ${d.jenis_mobil || ''}<br>Plat: ${d.plat_mobil || '-'} | WA: ${d.no_wa || '-'}<br>Status: ${d.status}</div>
    `).join('');
  }catch(e){
    document.getElementById('statusText').innerText = "Gagal konek: " + e.message;
  }
}
loadDriver();

async function pesan(){
  const nama = document.getElementById('nama').value.trim();
  const wa = document.getElementById('wa').value.trim();
  const dari = document.getElementById('dari').value.trim();
  const ke = document.getElementById('ke').value.trim();
  const jarak = parseFloat(document.getElementById('jarak').value) || 0;
  const layanan = document.getElementById('layanan').value;
  const tanggal = document.getElementById('tanggal').value;
  const total = hitung();
  if(!nama || !wa || !dari || !ke){ alert("Isi semua dulu bro!"); return; }

  const payload = {
    nama_penumpang: nama,
    no_wa: wa,
    dari_lokasi: dari,
    ke_lokasi: ke,
    jarak_km: jarak,
    jenis_layanan: layanan,
    total_harga: total,
    tanggal_berangkat: tanggal,
    status: "menunggu",
    driver_id: null
  };

  document.getElementById('statusText').innerText = "Mengirim order...";
  try{
    const res = await fetch(SUPABASE_URL + "/rest/v1/bookings", {method:"POST", headers: HEADERS, body: JSON.stringify(payload)});
    const data = await res.json();
    if(!res.ok){ alert("Gagal: " + JSON.stringify(data)); return; }
    document.getElementById('suksesBox').style.display = "block";
    document.getElementById('suksesDetail').innerText = `Order ${nama} ${dari} -> ${ke} Rp ${total.toLocaleString('id-ID')} - Status: menunggu`;
    document.getElementById('statusText').innerText = "Order masuk ✅ ID: " + (data[0]?.id || '-');
  }catch(e){ alert("Error: " + e.message); }
}
</script>
</body>
</html>
