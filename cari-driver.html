<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mencari Driver - Ammo Travel</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#f0f7f0;padding:14px;text-align:center}
.box{background:#fff;border-radius:20px;padding:20px;margin-top:20px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
.loader{width:70px;height:70px;border:6px solid #e0e0e0;border-top:6px solid #0a7a2e;border-radius:50%;margin:20px auto;animation:putar 1s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
.driver{display:none}
.foto{width:80px;height:80px;background:#0a7a2e;color:#fff;font-size:36px;line-height:80px;border-radius:50%;margin:10px auto}
.harga{font-size:26px;font-weight:800;color:#0a7a2e;margin:8px}
button{width:100%;padding:15px;border:0;border-radius:12px;font-size:16px;font-weight:700;margin-top:8px;cursor:pointer}
.btn-hijau{background:#0a7a2e;color:#fff}.btn-wa{background:#25D366;color:#fff}.btn-batal{background:#fff;color:#d00;border:2px solid #ffcccc}
</style></head>
<body>
<h2>🚗 AMMO TRAVEL</h2>
<div class="box" id="loading">
<div class="loader"></div>
<h3>Mencari Driver Terdekat...</h3>
<p id="info" style="color:#666;margin:10px"></p>
<p id="bayarInfo" style="font-size:13px;color:#0a7a2e;font-weight:700"></p>
<p style="font-size:13px;color:#999">Mohon tunggu, kami hubungkan dengan driver terbaik...</p>
<button class="btn-batal" onclick="batal()">❌ Batalkan Pencarian</button>
</div>
<div class="box driver" id="ketemu">
<div style="font-size:40px">✅</div>
<h3>Driver Ditemukan!</h3>
<div class="foto">👨‍✈️</div>
<b style="font-size:20px" id="nama">Budi Santoso</b>
<p style="color:#666">⭐ 4.9 • 1.240 perjalanan • Toyota Avanza</p>
<p style="font-weight:700;margin:8px">Plat: D 1234 ABC • Putih</p>
<p id="detail" style="color:#333"></p>
<div class="harga" id="hargaFinal"></div>
<p id="statusBayar" style="color:#0a7a2e;font-weight:700"></p>
<p style="color:#0a7a2e;font-weight:700">📍 Driver 5 menit lagi sampai di lokasi jemput!</p>
<button class="btn-hijau" onclick="alert('🎉 Pesanan dikonfirmasi! Driver sedang menuju lokasi Anda!');location.href='index.html'">✅ Konfirmasi, Driver Jalan!</button>
<button class="btn-wa" onclick="alert('Membuka WhatsApp Driver...')">💬 Chat Driver via WhatsApp</button>
<button class="btn-batal" onclick="batal()">❌ Batalkan Pesanan</button>
</div>
