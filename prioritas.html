<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRIORITAS - AMMO Travel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f2f2f2;padding:10px}
.kartu{background:#fff;border-radius:14px;padding:14px;max-width:420px;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.judul{text-align:center;font-size:20px;font-weight:bold;color:#d4a017;margin-bottom:2px}
.sub{text-align:center;font-size:12px;color:#888;margin-bottom:10px}
#statusTitle{text-align:center;font-weight:bold;font-size:15px;color:#d4a017;margin-bottom:8px}
.rute{background:#fff7e0;border:1px solid #ffe08a;border-radius:10px;padding:10px;font-size:14px;margin-bottom:10px;line-height:1.5}
.rute b{color:#333}
#ongkos{display:none}
.driver{background:#f8f8f8;border-radius:10px;padding:10px;margin-bottom:10px;display:none}
.driver b{font-size:15px}
.driver span{font-size:13px;color:#555}
.mencari{text-align:center;padding:12px;font-size:14px;color:#777}
.mencari .dot{font-size:22px;animation:kedip 1s infinite}
@keyframes kedip{0%,100%{opacity:1}50%{opacity:.3}}
.chatbox{border:1px solid #ddd;border-radius:10px;padding:8px;margin-bottom:8px}
.chatbox h4{font-size:13px;margin-bottom:6px}
#chatLog{height:90px;overflow-y:auto;background:#fafafa;border-radius:8px;padding:6px;font-size:13px;margin-bottom:6px}
.chat-input{display:flex;gap:6px}
.chat-input input{flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:13px}
.chat-input button{padding:8px 12px;background:#d4a017;color:#fff;border:none;border-radius:8px;font-weight:bold}
.tombol{display:flex;gap:8px;margin-top:8px}
.tombol button{flex:1;padding:10px;border:none;border-radius:10px;font-weight:bold;font-size:14px;cursor:pointer}
.btn-cs{background:#25D366;color:#fff}
.btn-batal{background:#ff3b30;color:#fff}
</style>
</head>
<body>
<div class="kartu">
<div class="judul">👑 PRIORITAS</div>
<div class="sub">AMMO Travel - Layanan Cepat</div>
<div id="statusTitle">PRIORITAS</div>

<div class="rute">
<b>Dari:</b> <span id="dari">-</span><br>
<b>Ke:</b> <span id="tujuan">-</span><br>
<b>Ongkos:</b> <span id="ongkos">-</span>
</div>

<div id="belumKetemu" class="mencari">
<div class="dot">● ● ●</div>
Mencari Driver Prioritas...<br><span style="font-size:12px">Mohon tunggu sebentar</span>
</div>

<div id="sudahKetemu" class="driver">
<b>Driver:</b> <span id="namaDriver">-</span><br>
<b>Plat:</b> <span id="platDriver">-</span><br>
<b>Rating:</b> ⭐ <span id="ratingDriver">-</span>
</div>

<div class="chatbox">
<h4>💬 Chat dengan Driver</h4>
<div id="chatLog"><div style="color:#888">Chat akan muncul di sini...</div></div>
<div class="chat-input">
<input id="chatInput" placeholder="Ketik pesan...">
<button onclick="kirimChat()">Kirim</button>
</div>
</div>

<div class="tombol">
<button class="btn-cs" onclick="hubungiCS()">📞 Call CS</button>
<button class="btn-batal" onclick="batalkanPesanan()">Batalkan Pesanan</button>
</div>
</div>

<script>
let ASAL={nama:'Bandung'}, TUJUAN={nama:'Jakarta'};
try{
let order=JSON.parse(localStorage.getItem('order_aktif')||'{}');
if(order.dari) ASAL.nama=order.dari;
if(order.ke) TUJUAN.nama=order.ke;
}catch(e){}
document.getElementById('dari').innerText=ASAL.nama;
document.getElementById('tujuan').innerText=TUJUAN.nama;

async function cariDriverOnline(){
  return {nama:'Asep - Prioritas', plat:'D 1234 AB', rating:'4.9'};
}
let cekDriver=setInterval(async ()=>{
  const driver=await cariDriverOnline();
  if(driver){ clearInterval(cekDriver); tampilkanDriver(driver); }
}, 5000);

function tampilkanDriver(d){
  document.getElementById('belumKetemu').style.display='none';
  document.getElementById('sudahKetemu').style.display='block';
  document.getElementById('namaDriver').innerText=d.nama;
  document.getElementById('platDriver').innerText=d.plat;
  document.getElementById('ratingDriver').innerText=d.rating;
}
function kirimChat(){
  const inp=document.getElementById('chatInput');
  const log=document.getElementById('chatLog');
  if(!inp.value) return;
  log.innerHTML+='<div style="text-align:right;margin-top:6px"><b>Kamu:</b> '+inp.value+'</div>';
  inp.value=''; log.scrollTop=log.scrollHeight;
}
function hubungiCS(){
  window.open('https://wa.me/6281234567890?text=Halo CS Prioritas','_blank');
}
function batalkanPesanan(){
  let list=JSON.parse(localStorage.getItem('pernah_batal')||'[]');
  list.push({dari:ASAL.nama, ke:TUJUAN.nama, ongkos:document.getElementById('ongkos').innerText});
  localStorage.setItem('pernah_batal', JSON.stringify(list));
  localStorage.removeItem('order_aktif');
  window.location.href='index.html';
}
// Auto tampil driver buat tes - hapus kalau mau nunggu driver beneran
setTimeout(()=>{ tampilkanDriver({nama:'Asep - Prioritas', plat:'D 1234 AB', rating:'4.9'}); }, 2000);
</script>
</body>
</html>
