<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver - Black Gold</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#000;color:#fff;max-width:480px;margin:auto;min-height:100vh;padding-bottom:90px}
.gold{color:#D4AF37}
.header{display:flex;justify-content:space-between;align-items:center;padding:20px 18px 10px}
.header h1{font-size:28px;color:#D4AF37;line-height:1.1}
.header h1 span{display:block;font-size:15px;color:#aaa;font-weight:400}
.profile-img{width:58px;height:58px;border-radius:50%;border:2px solid #D4AF37;object-fit:cover;cursor:pointer}
.divider{height:1px;background:linear-gradient(90deg,transparent,#D4AF37,transparent);margin:10px 18px}
.card{margin:14px 18px;background:#0d0d0d;border:1px solid #D4AF37;border-radius:14px;padding:16px}
.saldo-top{display:flex;justify-content:space-between;align-items:center}
.saldo-top small{color:#D4AF37}
.saldo-top h2{font-size:28px;margin-top:4px}
.btn-gold{background:linear-gradient(180deg,#F5D67B,#D4AF37);color:#000;border:none;padding:9px 16px;border-radius:8px;font-weight:700;cursor:pointer}
.btn-online{width:190px;margin:16px auto 4px;display:block;background:linear-gradient(180deg,#F5D67B,#D4AF37);color:#000;border:none;padding:11px;border-radius:25px;font-weight:800;font-size:16px;cursor:pointer}
.btn-online.offline{background:#333;color:#999}
.gps-info{text-align:center;font-size:12px;color:#D4AF37;margin-top:6px}
.section-title{margin:20px 18px 10px;color:#D4AF37;font-weight:700;display:flex;align-items:center;gap:8px}
.order-card{margin:0 18px;background:#0d0d0d;border:1px solid #D4AF37;border-radius:14px;padding:16px}
.badge{background:#D4AF37;color:#000;font-size:11px;font-weight:800;padding:3px 8px;border-radius:5px}
.order-card h3{margin:8px 0 12px}
.row{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14px}
.row b{color:#D4AF37}
.pills{display:flex;gap:8px;margin-top:14px}
.pill{border:1px solid #D4AF37;color:#D4AF37;padding:6px 10px;border-radius:8px;font-size:12px}
.btn-terima{margin:12px 18px;width:calc(100% - 36px);background:linear-gradient(180deg,#F5D67B,#D4AF37);border:none;padding:14px;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer}
.list-item{margin:10px 18px;background:#0d0d0d;border:1px solid #333;border-left:5px solid #D4AF37;border-radius:10px;padding:13px;display:flex;justify-content:space-between;align-items:center}
.list-item small{color:#bbb}
.tag-selesai{background:#4a3a00;color:#D4AF37;padding:4px 8px;border-radius:6px;font-size:12px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#0a0a0a;border-top:1px solid #D4AF37;display:flex;justify-content:space-around;padding:10px 0 14px;z-index:10}
.nav-item{text-align:center;color:#999;font-size:12px;cursor:pointer;background:none;border:none}
.nav-item.active{color:#D4AF37}
.nav-item .icon{font-size:22px;display:block}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-box{background:#111;border:1px solid #D4AF37;border-top-left-radius:18px;border-top-right-radius:18px;width:100%;max-width:480px;padding:20px;max-height:85vh;overflow:auto}
.modal-box h3{color:#D4AF37;margin-bottom:14px}
label{font-size:13px;color:#D4AF37;display:block;margin:12px 0 5px}
input{width:100%;padding:12px;background:#000;border:1px solid #D4AF37;border-radius:9px;color:#fff;outline:none}
input:focus{border-color:#F5D67B}
.flex{display:flex;gap:10px}
.btn-close{background:#333;color:#fff;border:none;padding:12px;border-radius:9px;flex:1;cursor:pointer}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1 id="haloNama">Halo, ...</h1>
    <span id="driverCode">Code: -</span>
  </div>
  <img id="fotoAtas" class="profile-img" src="https://via.placeholder.com/100" onclick="openSetting()">
</div>
<div class="divider"></div>

<div class="card">
  <div class="saldo-top">
    <div><small>💰 Saldo Emas</small><h2 id="saldo">Rp 0</h2></div>
    <button class="btn-gold" onclick="alert('Top Up - hubungkan ke payment nanti')">Top Up +</button>
  </div>
  <button id="btnOnline" class="btn-online" onclick="toggleOnline()">● ONLINE</button>
  <div class="gps-info" id="gpsInfo">📍 GPS berjalan di latar belakang • Lokasi diperbarui<br><b>GPS AKTIF</b></div>
</div>

<div class="section-title">🔔 Order Baru Masuk</div>
<div class="order-card">
  <span class="badge">BARU</span>
  <h3>Order <span id="orderId">#JD8742</span></h3>
  <div class="row">📍 <div><b>Pickup:</b><br><span id="pickup">Jl. Sudirman No. 45, Jakarta Pusat</span></div></div>
  <div class="row">📍 <div><b>Tujuan:</b><br><span id="tujuan">Plaza Indonesia, Thamrin</span></div></div>
  <div class="pills"><span class="pill">↗ 3.2 km</span><span class="pill">🕒 12 menit</span><span class="pill">💰 Rp 42.000</span></div>
</div>
<button class="btn-terima" onclick="terimaOrder()">Terima Order →</button>

<div class="section-title">☰ Daftar Order <span style="margin-left:auto;font-size:13px;font-weight:400">Lihat Semua ›</span></div>
<div id="listOrder"></div>

<!-- BOTTOM NAV : Beranda | Order | Setting GEAR TENGAH | Profil KANAN -->
<div class="bottom-nav">
  <button class="nav-item active" onclick="setNav(this)"> <span class="icon">🏠</span>Beranda</button>
  <button class="nav-item" onclick="setNav(this)"> <span class="icon">📋</span>Order</button>
  <button class="nav-item" onclick="openSetting()"> <span class="icon">⚙️</span>Setting</button>
  <button class="nav-item" onclick="openSetting()"> <span class="icon">👤</span>Profil</button>
</div>

<!-- MODAL SETTING -->
<div class="modal" id="modalSetting">
  <div class="modal-box">
    <h3>⚙️ Setting Driver</h3>
    <center><img id="fotoSetting" src="https://via.placeholder.com/100" style="width:90px;height:90px;border-radius:50%;border:2px solid #D4AF37;object-fit:cover"><br><br>
    <input type="file" id="inputFoto" accept="image/*" style="display:none" onchange="gantiFoto(event)">
    <button class="btn-gold" onclick="document.getElementById('inputFoto').click()">Ganti Foto Profil</button></center>
    <label>Nama Driver</label><input id="inNama" placeholder="Nama Driver">
    <label>Nomor WA</label><input id="inWA" placeholder="08xxxxxxxxxx">
    <label>PIN Driver</label><input id="inPIN" placeholder="PIN 4-6 digit" maxlength="6">
    <label>Code Driver</label><input id="inCode" placeholder="DRV001">
    <label>Foto Profil URL (opsional)</label><input id="inFoto" placeholder="https://...">
    <div class="flex" style="margin-top:18px"><button class="btn-close" onclick="closeSetting()">Batal</button><button class="btn-gold" style="flex:2" onclick="simpanSetting()">Simpan Perubahan</button></div>
  </div>
</div>

<script>
// ===== GANTI INI DENGAN DATA DRIVER YANG LOGIN =====
let driver = JSON.parse(localStorage.getItem('driver_login') || '{"nama":"Ko Cheng","code":"DRV001","wa":"081234567890","pin":"1234","foto":"https://via.placeholder.com/100","saldo":1250000}');
let isOnline = true;
let watchId = null;

function render(){
  document.getElementById('haloNama').textContent = 'Halo, ' + driver.nama;
  document.getElementById('driverCode').textContent = 'Code: ' + driver.code;
  document.getElementById('fotoAtas').src = driver.foto;
  document.getElementById('fotoSetting').src = driver.foto;
  document.getElementById('saldo').textContent = 'Rp ' + driver.saldo.toLocaleString('id-ID');
  document.getElementById('inNama').value = driver.nama;
  document.getElementById('inWA').value = driver.wa;
  document.getElementById('inPIN').value = driver.pin;
  document.getElementById('inCode').value = driver.code;
  document.getElementById('inFoto').value = driver.foto;
  // Contoh daftar order
  document.getElementById('listOrder').innerHTML = `
    <div class="list-item"><div><b>Order #JD8741 • Selesai</b><br><small>Kebayoran → Senayan • Rp 35.000</small></div><span class="tag-selesai">Selesai</span></div>
    <div class="list-item"><div><b>Order #JD8740 • Selesai</b><br><small>Menteng → Gambir • Rp 28.000</small></div><span class="tag-selesai">Selesai</span></div>`;
}
function toggleOnline(){
  isOnline = !isOnline;
  let btn = document.getElementById('btnOnline');
  if(isOnline){ btn.textContent='● ONLINE'; btn.classList.remove('offline'); }
  else{ btn.textContent='○ OFFLINE'; btn.classList.add('offline'); }
  // GPS TETAP JALAN walau offline, cuma status order berubah
  alert(isOnline ? 'Kamu ONLINE - Siap terima order' : 'Kamu OFFLINE - Istirahat, GPS tetap jalan di background');
}
function startGPS(){
  if('geolocation' in navigator){
    watchId = navigator.geolocation.watchPosition(pos=>{
      document.getElementById('gpsInfo').innerHTML = `📍 GPS berjalan di latar belakang • ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}<br><b>GPS AKTIF</b>`;
      // Kirim ke Supabase di sini: update driver location
      console.log('GPS:', pos.coords.latitude, pos.coords.longitude);
    }, err=>{ console.log(err); }, {enableHighAccuracy:true, maximumAge:10000});
  }
}
function terimaOrder(){ if(!isOnline) return alert('Kamu OFFLINE, nyalakan ONLINE dulu!'); alert('Order '+document.getElementById('orderId').textContent+' diterima!'); }
function setNav(el){ document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }
function openSetting(){ document.getElementById('modalSetting').classList.add('open'); }
function closeSetting(){ document.getElementById('modalSetting').classList.remove('open'); }
function gantiFoto(e){ let f=e.target.files[0]; if(f){ let r=new FileReader(); r.onload=()=>{ driver.foto=r.result; render(); }; r.readAsDataURL(f); } }
function simpanSetting(){
  driver.nama=document.getElementById('inNama').value;
  driver.wa=document.getElementById('inWA').value;
  driver.pin=document.getElementById('inPIN').value;
  driver.code=document.getElementById('inCode').value;
  if(document.getElementById('inFoto').value) driver.foto=document.getElementById('inFoto').value;
  localStorage.setItem('driver_login', JSON.stringify(driver));
  // TODO: update ke Supabase table drivers where code = driver.code
  render(); closeSetting(); alert('Setting tersimpan! Halo, '+driver.nama);
}
render(); startGPS();
</script>
</body>
</html>
