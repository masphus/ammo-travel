<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Driver - AMMO TRAVEL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#000;color:#fff}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#0a0a0a;padding:18px 16px 110px}
.logo{text-align:center;font-size:30px;font-weight:900;letter-spacing:2px;background:linear-gradient(180deg,#FFE9A8,#D4AF37,#9A7B1A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;padding:6px 0 2px}
.top{display:flex;justify-content:space-between;align-items:center;margin:12px 4px}
.top b{font-size:18px}
.pill{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:800;border:1px solid #333}
.pill.on{background:#16a34a;color:#fff;border-color:#16a34a}
.pill.off{background:#333;color:#aaa}
.card{border:1px solid #C9A227;border-radius:22px;padding:16px;background:#111;margin-top:12px}
.card h3{font-size:16px;margin-bottom:8px}
.card p{font-size:14px;line-height:1.6;color:#ddd}
.card b{color:#fff}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:900;margin-left:6px}
.badge.baru{background:#16a34a;color:#fff}
.badge.terima{background:#D4AF37;color:#000}
.btn{width:100%;margin-top:12px;padding:14px;border:none;border-radius:14px;background:linear-gradient(180deg,#FFE9A8,#D4AF37);font-size:16px;font-weight:900;cursor:pointer}
.btn2{width:100%;margin-top:8px;padding:12px;border:1px solid #ff4d4d;background:transparent;color:#ff6b6b;border-radius:12px;font-weight:800;cursor:pointer}
.btn3{width:100%;margin-top:8px;padding:12px;border:1px solid #555;background:#222;color:#fff;border-radius:12px;font-weight:800;cursor:pointer}
.kosong{text-align:center;color:#888;padding:18px 0;font-size:14px;line-height:1.6}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:15px;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:flex-end;justify-content:center;z-index:99}
.modal.open{display:flex}
.sheet{width:100%;max-width:480px;background:#111;border-radius:22px 22px 0 0;padding:20px 16px 24px;border-top:1px solid #C9A227;max-height:85vh;overflow:auto}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #222;font-size:14px}
.row span{color:#aaa}.row b{text-align:right}
</style>
</head>
<body>
<div class="app">
<div class="logo">AMMO TRAVEL</div>
<div class="top">
<div><b id="namaDriver">Driver AMMO</b><div id="ketOnline" style="font-size:12px;color:#aaa;margin-top:2px">OFFLINE - belum terima order</div></div>
<div class="pill off" id="pillStatus">● OFFLINE</div>
</div>

<div class="card">
<b>Nama Driver</b>
<input id="inpNama" placeholder="Contoh: Ahmad Sopir">
<button class="btn" id="btnOnline" onclick="toggleOnline()">GO ONLINE - SIAP TERIMA ORDER</button>
<p style="font-size:12px;color:#888;margin-top:8px">Harus ONLINE dulu, baru order penumpang masuk. Nama ini yang dilihat penumpang.</p>
</div>

<div class="card">
<h3>📥 Order Baru <span id="countBaru"></span></h3>
<div id="boxBaru"><div class="kosong">Belum ada order baru.<br>ONLINE dulu, tunggu penumpang pesan.</div></div>
</div>

<div class="card">
<h3>📋 Riwayat Saya</h3>
<div id="boxRiwayat"><div class="kosong">Belum ada riwayat.</div></div>
</div>

<button class="btn3" onclick="window.location.href='index.html'">KEMBALI KE BERANDA</button>
</div>

<div class="modal" id="modalOrder">
<div class="sheet">
<h2 id="mJudul" style="font-size:20px">Detail Order</h2>
<div id="mIsi" style="margin-top:12px"></div>
<button class="btn" onclick="terimaOrder()">✅ TERIMA ORDER</button>
<button class="btn2" onclick="tolakOrder()">❌ TOLAK ORDER</button>
<button class="btn3" onclick="tutupOrder()">Tutup</button>
</div>
</div>

<script>
const SUPABASE_URL = 'https://xxtgmohxdztesiubfxap.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cSeSerPzGTtFmnVOwKq97w_slkG9Hiv';
const H = {'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
const fmt = n => 'Rp ' + Math.round(n||0).toLocaleString('id-ID');
const $ = id => document.getElementById(id);
let isOnline = false;
let daftarOrder = [];
let orderTerpilih = null;
let driverNama = localStorage.getItem('ammo_driver_nama') || '';
let driverId = localStorage.getItem('ammo_driver_id') || '1';
if(driverNama){ $('inpNama').value = driverNama; $('namaDriver').textContent = driverNama; }

async function api(path, opt={}){
  let r = await fetch(SUPABASE_URL + '/rest/v1/' + path, {headers:H, ...opt});
  let t = await r.text();
  try{ return JSON.parse(t); }catch(e){ return []; }
}
function toggleOnline(){
  let n = $('inpNama').value.trim();
  if(!n){ alert('Isi nama driver dulu Ko!'); return; }
  driverNama = n;
  localStorage.setItem('ammo_driver_nama', n);
  $('namaDriver').textContent = n;
  isOnline = !isOnline;
  if(isOnline){
    $('pillStatus').textContent = '● ONLINE';
    $('pillStatus').className = 'pill on';
    $('ketOnline').textContent = 'ONLINE - Siap terima order';
    $('ketOnline').style.color = '#4ade80';
    $('btnOnline').textContent = 'GO OFFLINE';
    $('btnOnline').style.background = '#333';
    $('btnOnline').style.color = '#fff';
    loadOrderBaru(); loadRiwayat();
    window._poll = setInterval(()=>{ loadOrderBaru(); loadRiwayat(); }, 3000);
  } else {
    $('pillStatus').textContent = '● OFFLINE';
    $('pillStatus').className = 'pill off';
    $('ketOnline').textContent = 'OFFLINE - belum terima order';
    $('ketOnline').style.color = '#aaa';
    $('btnOnline').textContent = 'GO ONLINE - SIAP TERIMA ORDER';
    $('btnOnline').style.background = '';
    $('btnOnline').style.color = '';
    clearInterval(window._poll);
  }
}
async function loadOrderBaru(){
  if(!isOnline) return;
  let baru = await api('bookings?status=eq.mencari&order=created_at.desc&select=*');
  if(!Array.isArray(baru)) baru = [];
  daftarOrder = baru;
  $('countBaru').textContent = baru.length>0 ? '('+baru.length+')' : '';
  if(baru.length===0){
    $('boxBaru').innerHTML = '<div class="kosong">Belum ada order baru.<br>Tunggu penumpang pesan ya.</div>';
  } else {
    $('boxBaru').innerHTML = baru.map((o,i)=>`
      <div class="card" style="margin-top:10px">
        <h3>Order #${o.id} <span class="badge baru">BARU</span></h3>
        <p>Dari: <b>${o.dari_lokasi||o.pickup||'-'}</b><br>Ke: <b>${o.ke_lokasi||o.tujuan||'-'}</b><br>Tanggal: <b>${o.tanggal_berangkat||'-'} ${o.jam_berangkat||''}</b><br>Penumpang: <b>${o.nama_penumpang||'-'} - ${o.jumlah_orang||1} Orang</b><br>Jarak: <b>${o.jarak_km||'-'} km</b></p>
        <p style="margin-top:8px">Total: <b style="color:#E8C766;font-size:16px">${fmt(o.total_harga||0)}</b></p>
        <button class="btn" onclick="lihatOrder(${i})">Lihat Detail & Terima</button>
      </div>`).join('');
  }
}
async function loadRiwayat(){
  if(!isOnline) return;
  let r = await api('bookings?driver_id=eq.'+driverId+'&order=created_at.desc&limit=5&select=*');
  if(!Array.isArray(r) || r.length===0){
    $('boxRiwayat').innerHTML = '<div class="kosong">Belum ada riwayat.</div>';
    return;
  }
  $('boxRiwayat').innerHTML = r.map(o=>`<div style="padding:10px 0;border-bottom:1px solid #222;font-size:14px">Order #${o.id} - ${o.dari_lokasi||''} ke ${o.ke_lokasi||''}<br><span style="color:#aaa">${o.tanggal_berangkat||''} • ${fmt(o.total_harga||0)} • <b style="color:#E8C766">${o.status||''}</b></span></div>`).join('');
}
function lihatOrder(i){
  orderTerpilih = daftarOrder[i];
  if(!orderTerpilih) return;
  let o = orderTerpilih;
  $('mJudul').textContent = 'Order #' + o.id;
  $('mIsi').innerHTML = `
    <div class="row"><span>Penumpang</span><b>${o.nama_penumpang||'-'}</b></div>
    <div class="row"><span>No WA</span><b>${o.no_wa||'-'}</b></div>
    <div class="row"><span>Dari</span><b>${o.dari_lokasi||o.pickup||'-'}</b></div>
    <div class="row"><span>Tujuan</span><b>${o.ke_lokasi||o.tujuan||'-'}</b></div>
    <div class="row"><span>Tanggal</span><b>${o.tanggal_berangkat||'-'}</b></div>
    <div class="row"><span>Jam</span><b>${o.jam_berangkat||'-'}</b></div>
    <div class="row"><span>Jumlah Orang</span><b>${o.jumlah_orang||1} Orang</b></div>
    <div class="row"><span>Jarak</span><b>${o.jarak_km||'-'} km</b></div>
    <div class="row"><span>Estimasi</span><b>${o.estimasi||o.durasi||'-'}</b></div>
    <div class="row"><span>Total</span><b style="color:#E8C766">${fmt(o.total_harga||0)}</b></div>`;
  $('modalOrder').classList.add('open');
}
function tutupOrder(){ $('modalOrder').classList.remove('open'); orderTerpilih = null; }
async function terimaOrder(){
  if(!orderTerpilih) return;
  await api('bookings?id=eq.'+orderTerpilih.id, {method:'PATCH', body: JSON.stringify({status:'diterima', driver_id: Number(driverId)||1, driver_nama: driverNama, status_driver:'diterima'})});
  tutupOrder(); loadOrderBaru(); loadRiwayat();
  alert('Order diterima! Silahkan OTW ke titik jemput. Penumpang udah liat nama lu.');
}
async function tolakOrder(){
  if(!orderTerpilih) return;
  await api('bookings?id=eq.'+orderTerpilih.id, {method:'PATCH', body: JSON.stringify({status:'ditolak'})});
  tutupOrder(); loadOrderBaru(); loadRiwayat();
  alert('Order ditolak.');
}
</script>
</body>
</html>
