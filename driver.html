<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - Black Gold</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#000;color:#fff;max-width:480px;margin:auto;min-height:100vh;display:flex;flex-direction:column}
.top{padding:16px 18px;border-bottom:1px solid #D4AF37;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#000;z-index:10}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(180deg,#F5D67B,#D4AF37);display:flex;align-items:center;justify-content:center;font-size:22px}
.top b{color:#D4AF37}
.top small{color:#4CAF50;font-size:12px}
.chat{flex:1;padding:16px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-bottom:20px}
.bubble{max-width:80%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;animation:muncul .3s ease}
@keyframes muncul{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.bot{background:#111;border:1px solid #333;border-bottom-left-radius:4px;align-self:flex-start}
.me{background:linear-gradient(180deg,#F5D67B,#D4AF37);color:#000;border-bottom-right-radius:4px;align-self:flex-end;font-weight:600}
.ghost{background:#111;border:1px dashed #D4AF37;color:#D4AF37;align-self:flex-start;animation:kedip 1s infinite}
@keyframes kedip{0%,100%{opacity:1}50%{opacity:.4}}
.input-area{display:flex;gap:8px;padding:12px;background:#0a0a0a;border-top:1px solid #D4AF37;position:sticky;bottom:0}
.input-area input{flex:1;padding:12px;background:#000;border:1px solid #D4AF37;border-radius:25px;color:#fff;outline:none}
.input-area button{background:linear-gradient(180deg,#F5D67B,#D4AF37);border:none;width:46px;height:46px;border-radius:50%;font-size:18px;cursor:pointer}
.hint{text-align:center;color:#444;font-size:11px;padding:6px}
</style>
</head>
<body>
<div class="top">
  <div class="avatar">🦆</div>
  <div><b>Black Gold Bot</b><br><small>● Online - Balas Cepat</small></div>
</div>
<div class="chat" id="chatBox"></div>
<div class="hint">Ketik pesan apa aja, bot selalu online</div>
<div class="input-area">
  <input id="inp" placeholder="Ketik pesan..." autocomplete="off">
  <button onclick="kirim()">➤</button>
</div>

<script>
const SUPABASE_URL = 'https://xxtgmohxdztesiubfxap.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cSeSerPzGTtFmnVOwKq97w_slkG9Hiv';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let step = 'chat'; // chat -> minta_code -> minta_pin
let tempCode = '';
let tempRole = ''; // driver / admin

const chatBox = document.getElementById('chatBox');
const inp = document.getElementById('inp');

function addBubble(text, who){
  let d = document.createElement('div');
  d.className = 'bubble ' + who;
  d.innerHTML = text;
  chatBox.appendChild(d);
  chatBox.scrollTop = chatBox.scrollHeight;
  return d;
}
function botKetik(text, delay=600){
  let g = addBubble('👻 <i>mengetik...</i>', 'ghost');
  setTimeout(()=>{
    g.remove();
    addBubble(text, 'bot');
  }, delay);
}

// Pesan awal - keliatan kayak chat biasa
setTimeout(()=>{ botKetik('Halo! Selamat datang di Black Gold 🖤💛<br>Mau pesan apa hari ini?'); }, 500);

function kirim(){
  let teks = inp.value.trim();
  if(!teks) return;
  // Tampilkan pesan user, kalau lagi isi PIN, samarkan jadi ****
  if(step === 'minta_pin'){
    addBubble('••••••', 'me');
  } else {
    addBubble(teks, 'me');
  }
  inp.value = '';
  proses(teks);
}

inp.addEventListener('keyup', e=>{ if(e.key==='Enter') kirim(); });

async function proses(teks){
  let lower = teks.toLowerCase();

  // ===== STEP 1: PEMICU RAHASIA #bebek =====
  if(step === 'chat'){
    if(lower === '#bebek'){
      step = 'minta_code';
      setTimeout(()=>{
        addBubble('👻 <b>Hantu muncul...</b><br>Shhh... jangan berisik.<br><br>Masukkan <b>CODE</b> kamu:', 'bot');
      }, 400);
      return;
    }
    // Chat biasa biar gak ketauan
    if(lower.includes('halo') || lower.includes('hai') || lower.includes('hi')){
      botKetik('Halo juga! Mau order taksi? Ketik <b>ORDER</b> ya 😊');
    } else if(lower.includes('order')){
      botKetik('Siap! Kamu mau dijemput dimana? Kirim lokasi / alamat kamu ya 📍');
    } else if(lower.includes('harga') || lower.includes('tarif')){
      botKetik('Tarif kita mulai Rp 15.000 aja, tergantung jarak. Mau cek tarif kemana?');
    } else {
      botKetik('Oke noted! Admin kita akan balas sebentar lagi ya 🙏<br><i>Kamu bisa ketik ORDER untuk pesan taksi.</i>');
    }
    return;
  }

  // ===== STEP 2: MINTA CODE =====
  if(step === 'minta_code'){
    tempCode = teks.trim().toUpperCase();
    step = 'minta_pin';
    // PIN nongol kayak hantu
    let g = addBubble('👻 ...', 'ghost');
    setTimeout(()=>{
      g.remove();
      addBubble('CODE diterima... 👻<br><br>Sekarang masukkan <b>PIN 6 digit</b> kamu:', 'bot');
      inp.type = 'password';
      inp.placeholder = 'Masukkan PIN...';
    }, 800);
    return;
  }

  // ===== STEP 3: MINTA PIN + CEK DATABASE =====
  if(step === 'minta_pin'){
    let pin = teks.trim();
    addBubble('👻 <i>mengecek database...</i>', 'ghost');
    
    // Cek dulu di tabel DRIVERS
    let {data: driver} = await supabase.from('drivers').select('*').eq('code', tempCode).eq('pin', pin).single();
    
    // Kalau gak ada di drivers, cek di tabel ADMIN
    let isAdmin = false;
    let dataUser = driver;
    if(!driver){
      let {data: admin} = await supabase.from('admin').select('*').eq('code', tempCode).eq('pin', pin).single();
      if(admin){ dataUser = admin; isAdmin = true; }
    }

    // Hapus bubble hantu terakhir
    let ghosts = document.querySelectorAll('.ghost');
    ghosts.forEach(e=>e.remove());

    if(!dataUser){
      addBubble('👻 <b>CODE / PIN salah!</b><br>Hantu menghilang... 👻💨<br><br>Coba ketik <b>#bebek</b> lagi dari awal.', 'bot');
      step = 'chat';
      tempCode = '';
      inp.type = 'text';
      inp.placeholder = 'Ketik pesan...';
      return;
    }

    // ===== BERHASIL! =====
    addBubble(`👻 <b>BERHASIL!</b><br>Halo, ${dataUser.nama || tempCode}! 🎉<br>Membuka halaman kamu...`, 'bot');
    inp.type = 'text';
    
    setTimeout(()=>{
      if(isAdmin){
        // Kalau admin, lempar ke admin.html
        localStorage.setItem('admin_code', dataUser.code);
        window.location.href = 'admin.html?c=' + dataUser.code + '&p=' + pin;
      } else {
        // Kalau driver, lempar ke driver.html sesuai CODE & PIN nya
        // driver.html nanti yang validasi ulang & hapus ?c= &p= dari URL
        window.location.href = 'driver.html?c=' + dataUser.code + '&p=' + pin;
      }
    }, 1200);
    return;
  }
}
</script>
</body>
</html>
