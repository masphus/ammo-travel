<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver - Black Gold</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
html{background:#000}
body{background:#000;color:#fff;max-width:480px;margin:auto;min-height:100vh;position:relative;overflow-x:hidden;padding-bottom:88px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at top right, rgba(212,175,55,.18), transparent 50%), radial-gradient(circle at bottom left, rgba(212,175,55,.12), transparent 50%);pointer-events:none}
/* ===== TOP - SAMA KAYAK GAMBAR ===== */
.top{padding:22px 20px 10px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.top h1{font-size:28px;color:#E8C86A;font-weight:800;line-height:1.1;letter-spacing:.2px}
.top h1 span{color:#E8C86A}
.avatar{width:62px;height:62px;border-radius:50%;border:2px solid #D4AF37;overflow:hidden;background:#222;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.garis{height:1px;background:linear-gradient(90deg,transparent,#D4AF37,transparent);margin:10px 20px 14px;position:relative;z-index:1}
/* ===== SALDO - SAMA KAYAK GAMBAR ===== */
.card-saldo{margin:0 20px;background:linear-gradient(180deg,#14100a,#0a0a0a);border:1px solid #D4AF37;border-radius:16px;padding:16px;position:relative;overflow:hidden;z-index:1}
.card-saldo::before,.card-saldo::after{content:'';position:absolute;width:42px;height:42px;border:1px solid #D4AF37;pointer-events:none}
.card-saldo::before{top:-1px;right:-1px;border-left:none;border-bottom:none;border-top-right-radius:16px}
.card-saldo::after{bottom:-1px;left:-1px;border-right:none;border-top:none;border-bottom-left-radius:16px}
.saldo-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.saldo-row small{color:#D4AF37;font-size:14px;display:flex;align-items:center;gap:7px}
.saldo-row small::before{content:'$';width:28px;height:28px;background:linear-gradient(180deg,#F5D67B,#D4AF37);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:15px}
.saldo-row h2{font-size:28px;margin-top:5px;letter-spacing:.3px;color:#fff}
.btn-topup{background:linear-gradient(180deg,#F5D67B,#D4AF37);border:none;padding:10px 16px;border-radius:8px;font-weight:800;cursor:pointer;color:#000;font-size:15px;white-space:nowrap}
.online-wrap{text-align:center;margin-top:16px}
.btn-online{background:linear-gradient(180deg,#F5D67B,#D4AF37);border:none;padding:9px 26px;border-radius:22px;font-weight:800;cursor:pointer;color:#000;display:inline-flex;align-items:center;gap:9px;font-size:16px}
.btn-online.off{background:#222;color:#999;border:1px solid #444}
.dot{width:11px;height:11px;border-radius:50%;background:#000}
.dot.off{background:#ff4444}
.online-wrap small{color:#4CAF50;font-size:13px;display:block;margin-top:7px}
.online-wrap small.off{color:#888}
h3{padding:20px 20px 12px;color:#E8C86A;font-size:19px;position:relative;z-index:1}
/* ===== ORDER BARU - SAMA KAYAK GAMBAR ===== */
.card-order{margin:0 20px;background:#0d0d0d;border:1px solid #D4AF37;border-radius:14px;padding:16px;position:relative;z-index:1}
.card-order::before,.card-order::after{content:'';position:absolute;width:20px;height:20px;border:1px solid #D4AF37;pointer-events:none}
.card-order::before{top:-1px;right:-1px;border-left:none;border-bottom:none}
.card-order::after{bottom:-1px;left:-1px;border-right:none;border-top:none}
.badge{display:inline-block;background:#D4AF37;color:#000;font-size:12px;font-weight:800;padding:4px 10px;border-radius:5px;margin-bottom:10px;position:static}
.order-id{font-weight:800;font-size:19px;color:#fff}
.pick{display:flex;gap:12px;margin-top:14px;padding-bottom:12px;border-bottom:1px dashed #444}
.pick:last-of-type{border:none;padding-bottom:0}
.pick .ico{width:36px;height:36px;background:#D4AF37;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;color:#000}
.pick small{color:#aaa;font-size:13px}
.pick b{font-size:14px;font-weight:600;line-height:1.4;color:#fff}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{border:1px solid #D4AF37;border-radius:20px;padding:7px 12px;font-size:13px;color:#E8C86A;background:#111}
.btn-terima{margin:14px 20px 0;width:calc(100% - 40px);background:linear-gradient(180deg,#F5D67B,#D4AF37);border:none;padding:15px;border-radius:12px;font-weight:800;font-size:17px;cursor:pointer;color:#000;position:relative;z-index:1}
.btn-terima:disabled{background:#222;color:#666}
/* ===== DAFTAR ORDER - SAMA KAYAK GAMBAR ===== */
.daftar-head{padding:20px 20px 12px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.daftar-head h3{padding:0}
.daftar-head a{color:#E8C86A;font-size:14px;text-decoration:none}
.item{margin:0 20px 10px;background:#0d0d0d;border:1px solid #D4AF37;border-left:4px solid #D4AF37;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.item b{font-size:14px;color:#fff}
.item small{color:#aaa;font-size:13px}
.sts{background:#5a4310;color:#E8C86A;font-size:12px;padding:6px 10px;border-radius:7px;white-space:nowrap}
/* ===== BOTTOM NAV - SAMA KAYAK GAMBAR ===== */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#000;border-top:1px solid #D4AF37;display:flex;justify-content:space-around;padding:10px 0 14px;z-index:50}
.nav a{text-align:center;color:#888;text-decoration:none;font-size:12px}
.nav a.aktif{color:#E8C86A}
.nav span{display:block;font-size:22px}
.empty{margin:0 20px;text-align:center;color:#777;font-size:13px;padding:14px;border:1px dashed #333;border-radius:10px;position:relative;z-index:1}
#loading{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99;font-size:14px;color:#D4AF37;flex-direction:column;gap:10px}
#loading button{background:#D4AF37;border:none;padding:10px 18px;border-radius:10px;font-weight:800;cursor:pointer;display:none}
</style>
</head>
<body>
<div id="loading"><div id="loadingTxt">👻 Mengecek karcis...</div><button id="btnBalik" onclick="keIndex()">⬅ Balik ke Beranda</button></div>

<div class="top">
  <h1>Halo, <span id="namaDriver">Driver</span></h1>
  <div class="avatar"><img id="fotoDriver" src="https://via.placeholder.com/100" alt="Driver"></div>
</div>
<div class="garis"></div>

<div class="card-saldo">
  <div class="saldo-row">
    <div><small>🪙 Saldo Emas</small><h2 id="saldo">Rp 0</h2></div>
    <button class="btn-topup" onclick="topup()">Top Up +</button>
  </div>
  <div class="online-wrap">
    <button class="btn-online" id="btnOnline" onclick="toggleOnline()"><span class="dot" id="dotOnline"></span><span id="txtOnline">ONLINE</span></button>
    <small id="txtStatus">● Aktif menerima order ●</small>
  </div>
</div>

<h3>🔔 Order Baru Masuk</h3>
<div id="orderBaru"></div>
<button class="btn-terima" id="btnTerima" onclick="terimaOrder()">Terima Order →</button>

<div class="daftar-head"><h3>☰ Daftar Order</h3><a href="#" onclick="loadRiwayat();return false;">Lihat Semua ›</a></div>
<div id="daftarOrder"></div>

<div class="nav">
  <a href="#" class="aktif"><span>🏠</span>Beranda</a>
  <a href="#" onclick="loadRiwayat();return false;"><span>📋</span>Order</a>
  <a href="#" onclick="alert('Setting segera hadir');return false;"><span>⚙️</span>Setting</a>
  <a href="#" onclick="logout();return false;"><span>👤</span>Profil</a>
</div>

<script>
const SUPABASE_URL = 'https://xxtgmohxdztesiubfxap.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cSeSerPzGTtFmnVOwKq97w_slkG9Hiv';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let driver = null;
let orderAktif = null;
let sudahMasuk = false;
function rupiah(n){ return 'Rp ' + (Number(n)||0).toLocaleString('id-ID'); }
function keIndex(){
  try{ localStorage.removeItem('ammo_driver_token'); localStorage.removeItem('ammo_driver'); localStorage.removeItem('ammo_driver_id'); localStorage.removeItem('ammo_driver_nama'); }catch(e){}
  window.location.replace('index.html');
}
function gagal(msg){
  if(sudahMasuk) return;
  var t = document.getElementById('loadingTxt');
  if(t) t.textContent = msg || 'Karcis tidak valid. Balik ke beranda ya.';
  var b = document.getElementById('btnBalik');
  if(b) b.style.display = 'block';
}
function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// FIX 1: Terima token dari ammo_driver_token ATAU ammo_admin_token (cadangan)
// FIX 2: Jangan wajibin ammo_driver JSON & role di localStorage, validasi dari DB aja.
// Karena index kadang nyimpen token admin di ammo_driver_token, jadi token bisa ketuker.
function bacaKarcis(){
  var tok = '';
  try{ tok = localStorage.getItem('ammo_driver_token') || localStorage.getItem('ammo_admin_token') || sessionStorage.getItem('ammo_admin_token') || ''; }catch(e){}
  if(!tok) return null;
  var parts = String(tok).split('|');
  if(parts.length < 3) return null;
  var codeVal = String(parts[0]||'').replace(/^[#@]+/,'').toLowerCase().trim();
  var pinVal = String(parts[1]||'').trim();
  var exp = Number(parts[2]||0);
  if(!codeVal || !pinVal || !exp || Date.now() > exp) return null;
  return { codeVal: codeVal, pinVal: pinVal, exp: exp, raw: tok };
}

async function cekAkses(){
  var k = bacaKarcis();
  if(!k){ gagal('Karcis kosong / kadaluarsa. Login lagi dari beranda ya.'); return; }
  var codeVal = k.codeVal, pinVal = k.pinVal;
  var hasil = null;

  // 1. RPC - WAJIB filter role driver, karena RPC sekarang UNION admin + driver
  try{
    var r = await sb.rpc('cek_pin_login', { p_code: codeVal, p_pin: pinVal });
    if(r && !r.error && r.data && r.data.length){
      var list = Array.isArray(r.data) ? r.data : [r.data];
      hasil = list.find(function(x){ return String(x.role||'').toLowerCase() === 'driver'; }) || null;
      // Kalau RPC cuma ngembaliin admin (code ketuker), jangan dipake buat driver
      if(!hasil && list.length && String(list[0].role||'').toLowerCase() === 'admin') hasil = null;
    }
  }catch(e){}

  // 2. Fallback tabel drivers - cari pake CODE doang, PIN dibandingin pake String()
  if(!hasil){
    try{
      var d = await sb.from('drivers').select('*').ilike('code', codeVal).maybeSingle();
      if(d && d.data && String(d.data.pin) === String(pinVal)) hasil = d.data;
    }catch(e){}
  }

  // 3. Fallback tabel driver lama
  if(!hasil){
    try{
      var d2 = await sb.from('driver').select('*').ilike('code', codeVal).maybeSingle();
      if(d2 && d2.data && String(d2.data.pin) === String(pinVal)) hasil = d2.data;
    }catch(e){}
  }

  if(!hasil){ gagal('Code / PIN driver tidak ketemu di database.'); return; }

  // Status harus aktif
  var st = String(hasil.status || '').toLowerCase().trim();
  if(st !== 'aktif' && st !== 'active'){ gagal('Akun driver belum aktif. Minta admin aktifin dulu ya.'); return; }

  driver = hasil;
  sudahMasuk = true;
  try{ localStorage.setItem('ammo_driver', JSON.stringify(driver)); }catch(e){}
  try{ localStorage.setItem('ammo_driver_id', driver.id); }catch(e){}
  try{ localStorage.setItem('ammo_driver_nama', driver.nama || ''); }catch(e){}
  try{ localStorage.setItem('ammo_role', 'driver'); }catch(e){}
  // FIX 3: JANGAN update is_online / last_seen di sini. Kolom itu gak ada di tabel drivers,
  // bikin request error terus. Online cukup di memori aja.
  try{ localStorage.setItem('ammo_driver_token', codeVal + '|' + pinVal + '|' + k.exp); }catch(e){}

  document.getElementById('loading').style.display = 'none';
  tampilDriver();
  loadOrderBaru();
  loadRiwayat();
  try{
    sb.channel('bookings-realtime').on('postgres_changes',{event:'*',schema:'public',table:'bookings'},function(){ loadOrderBaru(); loadRiwayat(); }).subscribe();
  }catch(e){}
}

function tampilDriver(){
  document.getElementById('namaDriver').textContent = driver.nama || 'Driver';
  document.getElementById('saldo').textContent = rupiah(driver.saldo || driver.saldo_emas || driver.saldoEmas || 0);
  if(driver.foto || driver.foto_url || driver.avatar) document.getElementById('fotoDriver').src = driver.foto || driver.foto_url || driver.avatar;
  updateTombolOnline();
}
function updateTombolOnline(){
  var btn=document.getElementById('btnOnline'), dot=document.getElementById('dotOnline'), txt=document.getElementById('txtOnline'), st=document.getElementById('txtStatus');
  // Default ONLINE, karena status driver di DB udah aktif
  var online = driver.is_online !== false;
  if(online){ btn.classList.remove('off'); dot.classList.remove('off'); txt.textContent='ONLINE'; st.textContent='● Aktif menerima order ●'; st.classList.remove('off'); }
  else { btn.classList.add('off'); dot.classList.add('off'); txt.textContent='OFFLINE'; st.textContent='● Kamu sedang offline ●'; st.classList.add('off'); }
}
function toggleOnline(){
  driver.is_online = !(driver.is_online !== false);
  updateTombolOnline();
}

// FIX 4: Order asli ada di tabel bookings, bukan orders. Coba bookings dulu, baru orders.
function normalisasiOrder(o){
  if(!o) return null;
  return {
    id: o.id,
    kode: o.kode || o.id,
    pickup: o.pickup || o.dari_lokasi || o.dari || o.asal || '-',
    tujuan: o.tujuan || o.destination || o.ke_lokasi || o.ke || '-',
    jarak: o.jarak || o.jarak_km || o.jarak_meter || '-',
    estimasi: o.estimasi || o.estimasi_teks || '-',
    harga: o.harga || o.tarif || o.total_harga || o.nominal || 0,
    status: o.status || '-'
  };
}
async function ambilOrderBaru(){
  // bookings = tabel asli penumpang.html / admin.html
  try{
    var b = await sb.from('bookings').select('*').eq('status','baru').order('created_at',{ascending:true}).limit(1).maybeSingle();
    if(b && b.data) return normalisasiOrder(b.data);
  }catch(e){}
  try{
    var o = await sb.from('orders').select('*').eq('status','baru').order('created_at',{ascending:true}).limit(1).maybeSingle();
    if(o && o.data) return normalisasiOrder(o.data);
  }catch(e){}
  return null;
}
async function loadOrderBaru(){
  try{
    var data = await ambilOrderBaru();
    var box=document.getElementById('orderBaru');
    var btn=document.getElementById('btnTerima');
    if(!data){ orderAktif=null; box.innerHTML='<div class="empty">Belum ada order baru, tunggu ya bro... ☕</div>'; btn.disabled=true; return; }
    orderAktif=data;
    btn.disabled=false;
    box.innerHTML='<div class="card-order"><span class="badge">BARU</span><div class="order-id">Order #'+esc(String(data.kode).slice(0,6).toUpperCase())+'</div><div class="pick"><div class="ico">📍</div><div><small>Pickup:</small><br><b>'+esc(data.pickup)+'</b></div></div><div class="pick" style="border:none;padding-bottom:0"><div class="ico">📍</div><div><small>Tujuan:</small><br><b>'+esc(data.tujuan)+'</b></div></div><div class="chips"><span class="chip">↗ '+esc(data.jarak)+' km</span><span class="chip">🕒 '+esc(data.estimasi)+'</span><span class="chip">💰 '+rupiah(data.harga)+'</span></div></div>';
  }catch(e){
    document.getElementById('orderBaru').innerHTML='<div class="empty">Belum ada order baru, tunggu ya bro... ☕</div>';
  }
}
async function terimaOrder(){
  if(!orderAktif) return;
  if(!confirm('Terima Order #' + (orderAktif.kode||'') + ' ?')) return;
  try{
    var upd = { status:'diterima', driver_id: driver.id, driver_code: driver.code, updated_at: new Date().toISOString() };
    var r1 = await sb.from('bookings').update(upd).eq('id', orderAktif.id);
    if(r1 && r1.error) await sb.from('orders').update(upd).eq('id', orderAktif.id);
  }catch(e){}
  alert('Order diterima! Gas bro! 🛵💨');
  loadOrderBaru(); loadRiwayat();
}
async function loadRiwayat(){
  if(!driver) return;
  var box=document.getElementById('daftarOrder');
  var data = [];
  try{
    var r = await sb.from('bookings').select('*').eq('driver_id', driver.id).order('created_at',{ascending:false}).limit(10);
    if(r && r.data && r.data.length) data = r.data.map(normalisasiOrder);
  }catch(e){}
  if(!data.length){
    try{
      var r2 = await sb.from('bookings').select('*').eq('status','selesai').order('created_at',{ascending:false}).limit(5);
      if(r2 && r2.data) data = r2.data.map(normalisasiOrder);
    }catch(e){}
  }
  if(!data.length){
    try{
      var r3 = await sb.from('orders').select('*').eq('driver_id', driver.id).order('created_at',{ascending:false}).limit(10);
      if(r3 && r3.data) data = r3.data.map(normalisasiOrder);
    }catch(e){}
  }
  if(!data || data.length===0){ box.innerHTML='<div class="empty">Belum ada riwayat order.</div>'; return; }
  box.innerHTML = data.map(function(o){
    return '<div class="item"><div><b>Order #'+esc(String(o.kode).slice(0,6).toUpperCase())+' • '+(o.status==='selesai'?'Selesai':esc(o.status))+'</b><br><small>'+esc(o.pickup)+' → '+esc(o.tujuan)+' • '+rupiah(o.harga)+'</small></div><span class="sts">'+(o.status==='selesai'?'Selesai':esc(o.status))+'</span></div>';
  }).join('');
}
function topup(){ var n=prompt('Mau Top Up berapa? Contoh: 50000'); if(!n) return; alert('Top Up Rp '+Number(n).toLocaleString('id-ID')+' - Hubungi admin untuk konfirmasi ya bro!'); }
function logout(){ if(confirm('Keluar?')){ try{ localStorage.removeItem('ammo_driver_token'); localStorage.removeItem('ammo_driver'); localStorage.removeItem('ammo_role'); localStorage.removeItem('ammo_driver_id'); localStorage.removeItem('ammo_driver_nama'); }catch(e){} window.location.replace('index.html'); } }

// Timeout pengaman: kalau 8 detik belum masuk, jangan muter terus, kasih tombol balik
setTimeout(function(){ if(!sudahMasuk && document.getElementById('loading').style.display !== 'none'){ gagal('Lama banget ngeceknya, kemungkinan jaringan / database lambat. Coba balik & login lagi ya.'); } }, 8000);

cekAkses();
</script>
</body>
</html>
