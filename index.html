<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMMO TRAVEL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;display:flex;justify-content:center}
.phone{width:100%;max-width:430px;background:#0a0a0a;min-height:100vh;color:#fff;padding:14px 16px 20px;position:relative}
.top{border:1.5px solid #d4af37;background:#111;text-align:center;padding:10px;margin-bottom:14px}
.top h1{font-size:28px;letter-spacing:6px;color:#e8c96a}
.top small{letter-spacing:4px;color:#e8c96a;font-size:11px}
.card{border:1.5px solid #d4af37;border-radius:18px;background:#131313;padding:16px;margin-bottom:14px}
.card h2{color:#e8c96a;font-size:18px;margin-bottom:12px}
label{font-size:12px;color:#e8c96a;letter-spacing:1px;font-weight:900}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#0f0f0f;color:#fff;font-size:15px;margin:6px 0 12px;outline:none}
input:focus{border-color:#d4af37}
.saran{margin:-8px 0 12px;background:#1a1a1a;border:1px solid #333;border-radius:12px;overflow:hidden;display:none}
.saran div{padding:11px 12px;font-size:14px;border-bottom:1px solid #222;cursor:pointer}
.saran div:last-child{border:none}
.saran div:hover{background:#2a2410}
.saran small{display:block;color:#aaa;font-size:12px}
.btn-order{width:100%;padding:16px;border:none;border-radius:999px;background:linear-gradient(#ffe98a,#d4af37 55%,#b8962e);color:#000;font-weight:900;font-size:19px;letter-spacing:1px;cursor:pointer}
.btn-order:disabled{opacity:.5}
.btn-akun{width:100%;padding:13px;border-radius:12px;border:1px solid #d4af37;background:#111;color:#e8c96a;font-weight:900;cursor:pointer;margin-top:10px}
.peta{height:180px;border-radius:14px;background:#1a1a1a;border:1px solid #333;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:13px;text-align:center;padding:16px;line-height:1.5}
.info{display:flex;gap:10px;margin-top:12px}
.info div{flex:1;background:#0f0f0f;border:1px solid #333;border-radius:12px;padding:10px;font-size:13px;color:#f5d76e}
.info b{display:block;color:#e8c96a;font-size:15px;margin-top:2px}
.footer{text-align:center;color:#e8c96a;font-size:12px;margin-top:16px}
.footer span{color:#666;margin:0 6px}
/* MODAL AKUN */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-box{width:100%;max-width:430px;background:#1a1a1a;border-radius:18px 18px 0 0;padding:20px 16px;max-height:88vh;overflow-y:auto}
.modal-box h3{text-align:center;color:#e8c96a;font-size:20px;margin-bottom:4px}
.modal-box p{text-align:center;color:#aaa;font-size:13px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:11px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;font-weight:900;cursor:pointer}
.tabs button.aktif{background:#d4af37;color:#000;border-color:#d4af37}
.btn-utama{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(#ffe98a,#d4af37 55%,#b8962e);color:#000;font-weight:900;font-size:16px;cursor:pointer;margin-top:4px}
.btn-google{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#fff;color:#000;font-weight:900;cursor:pointer;margin-top:10px}
.btn-close{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;font-weight:900;cursor:pointer;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a1a1a;border:1px solid #d4af37;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:200;display:none;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{display:block}
.toast.err{border-color:#ff2b2b}
</style>
</head>
<body>
<div class="phone">
<div class="top"><h1>AMMO TRAVEL</h1><small>LAYANAN TRAVEL TERPERCAYA</small></div>

<div style="text-align:right;font-size:13px;margin-bottom:10px"><span id="namaUserTop">Belum login</span> • <a href="javascript:void(0)" onclick="bukaAkun()" style="color:#e8c96a;font-weight:900">Akun</a></div>

<div class="card">
<h2>🚗 PESAN TRAVEL</h2>
<label>DARI</label>
<input id="pickup" placeholder="Ketik Dari... misal Bandung" autocomplete="off">
<div id="saranPickup" class="saran"></div>
<label>TUJUAN</label>
<input id="dest" placeholder="Ketik Tujuan... misal Jakarta" autocomplete="off">
<div id="saranDest" class="saran"></div>
<div class="peta" id="petaBox">📍 PETA<br>Pilih Dari &amp; Tujuan dari saran di atas.<br><small id="petaInfo" style="color:#e8c96a">Belum ada rute</small></div>
<div class="info"><div>🅰️ Jarak<b id="infoJarak">-</b></div><div>🕒 Estimasi<b id="infoEstimasi">-</b></div></div>
<div class="info"><div>💰 Estimasi Tarif<b id="infoTarif">Rp. 0</b></div><div>📍 Rute<b id="infoRute">-</b></div></div>
</div>

<button class="btn-order" id="btnOrder" onclick="cekDriver()">ORDER NOW</button>
<button class="btn-akun" onclick="bukaAkun()">👤 AKUN SAYA</button>
<div class="footer">AMMO TRAVEL <span>•</span> Layanan Travel Terpercaya <span>•</span> © 2024</div>
</div>

<!-- MODAL AKUN -->
<div id="modalAkun" class="modal"><div class="modal-box">
<h3>AKUN SAYA</h3><p id="akunSub">Login / Daftar untuk lanjut order</p>
<div class="tabs"><button id="tabLogin" class="aktif" onclick="setTab('login')">LOGIN</button><button id="tabDaftar" onclick="setTab('daftar')">DAFTAR</button></div>
<div id="formLogin">
<label>NAMA / NO. TELEPON / EMAIL</label><input id="loginUser" placeholder="Nama / No. Telepon">
<label>PASSWORD</label><input id="loginPass" type="password" placeholder="Password">
<button class="btn-utama" onclick="doLogin()">MASUK</button>
</div>
<div id="formDaftar" style="display:none">
<label>NAMA LENGKAP</label><input id="daftarNama" placeholder="Nama lengkap">
<label>NO. TELEPON</label><input id="daftarHp" placeholder="08xxxxxxxxxx">
<label>PASSWORD</label><input id="daftarPass" type="password" placeholder="Buat password">
<button class="btn-utama" onclick="doDaftar()">DAFTAR</button>
</div>
<button class="btn-google" onclick="loginGoogle()">G Google</button>
<button class="btn-close" onclick="tutupAkun()">Tutup</button>
</div></div>

<div id="toast" class="toast"></div>

<script>
function $(id){return document.getElementById(id)}
let pickupCoord=null, destCoord=null, tabAktif='login';
let mauOrderFlag = localStorage.getItem('ammo_mau_order')==='1';

/* ===== TOAST ===== */
function showToast(judul,isi,isErr){
  let t=$('toast'); t.innerHTML='<b>'+judul+'</b><br>'+(isi||''); t.className='toast show'+(isErr?' err':'');
  clearTimeout(t._tm); t._tm=setTimeout(()=>{t.className='toast'},2600);
}

/* ===== LOGIN STATE ===== */
function getSesi(){ try{return JSON.parse(localStorage.getItem('ammo_sesi')||'null')}catch(e){return null} }
function setSesi(s){ localStorage.setItem('ammo_sesi',JSON.stringify(s)); updateTop(); }
function sudahLogin(){ let s=getSesi(); return !!(s && s.nama); }
function updateTop(){ let s=getSesi(); $('namaUserTop').textContent = s&&s.nama ? 'Halo, '+s.nama : 'Belum login'; }
updateTop();

function mauLanjutOrder(){ return localStorage.getItem('ammo_mau_order')==='1'; }
function setMauOrder(v){ if(v){localStorage.setItem('ammo_mau_order','1')}else{localStorage.removeItem('ammo_mau_order')} mauOrderFlag=v; }

/* ===== PENDING ORDER ===== */
function simpanPendingOrder(){
  localStorage.setItem('ammo_pending_order',JSON.stringify({asal:$('pickup').value.trim(),tujuan:$('dest').value.trim(),asalCoord:pickupCoord,destCoord:destCoord}));
}
function pulihkanPendingOrder(){
  try{
    let p=JSON.parse(localStorage.getItem('ammo_pending_order')||'null'); if(!p) return;
    if(p.asal && !$('pickup').value) $('pickup').value=p.asal;
    if(p.tujuan && !$('dest').value) $('dest').value=p.tujuan;
    if(p.asal) $('pickup').value=p.asal;
    if(p.tujuan) $('dest').value=p.tujuan;
    if(p.asalCoord) pickupCoord=p.asalCoord;
    if(p.destCoord) destCoord=p.destCoord;
  }catch(e){}
}
pulihkanPendingOrder();

/* ===== GEOCODE + RUTE ===== */
async function geocodeAlamat(q){
  try{
    let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=id&q='+encodeURIComponent(q));
    let d=await r.json(); if(d.length) return [parseFloat(d[0].lat),parseFloat(d[0].lon)];
  }catch(e){} return null;
}
async function cariSaran(q,boxId,tipe){
  let box=$(boxId); if(!q || q.length<3){ box.style.display='none'; return; }
  try{
    let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=id&q='+encodeURIComponent(q));
    let d=await r.json();
    if(!d.length){ box.style.display='none'; return; }
    box.innerHTML=''; d.forEach(it=>{
      let el=document.createElement('div'); el.innerHTML='<b>'+it.display_name.split(',')[0]+'</b><small>'+it.display_name+'</small>';
      el.onclick=()=>{ if(tipe==='pickup'){ $('pickup').value=it.display_name; pickupCoord=[parseFloat(it.lat),parseFloat(it.lon)]; } else { $('dest').value=it.display_name; destCoord=[parseFloat(it.lat),parseFloat(it.lon)]; } box.style.display='none'; hitungRute(); };
      box.appendChild(el);
    }); box.style.display='block';
  }catch(e){}
}
$('pickup').addEventListener('input',e=>cariSaran(e.target.value,'saranPickup','pickup'));
$('dest').addEventListener('input',e=>cariSaran(e.target.value,'saranDest','dest'));
function fmtRp(n){return 'Rp. '+Math.round(n).toLocaleString('id-ID')}
function fmtJarak(m){let km=m/1000; return km>=100?Math.round(km)+' km':km.toFixed(1).replace('.',',')+' km'}
function fmtEstimasi(detik){let m=Math.round(detik/60),h=Math.floor(m/60); if(h>0) return h+' jam '+(m%60)+' menit'; return m+' menit'}
async function hitungRute(){
  let a=$('pickup').value.trim(), b=$('dest').value.trim();
  if(!a||!b) return;
  if(!pickupCoord) pickupCoord=await geocodeAlamat(a);
  if(!destCoord) destCoord=await geocodeAlamat(b);
  if(!pickupCoord||!destCoord) return;
  try{
    let url='https://router.project-osrm.org/route/v1/driving/'+pickupCoord[1]+','+pickupCoord[0]+';'+destCoord[1]+','+destCoord[0]+'?overview=false';
    let r=await fetch(url); let d=await r.json();
    if(d.routes&&d.routes.length){
      let route=d.routes[0], km=route.distance/1000, ongkos=Math.max(Math.round(km),10)*5000;
      $('infoJarak').textContent='~ '+fmtJarak(route.distance);
      $('infoEstimasi').textContent='± '+fmtEstimasi(route.duration);
      $('infoTarif').textContent=fmtRp(ongkos);
      $('infoRute').textContent=a.split(',')[0]+' → '+b.split(',')[0];
      $('petaInfo').textContent=a.split(',')[0]+' → '+b.split(',')[0]+' • '+fmtJarak(route.distance);
    }
  }catch(e){}
}

/* ===== ORDER FLOW - INI YANG DIBENERIN ===== */
async function simpanOrderDanLanjut(){
  let a=$('pickup').value.trim(), b=$('dest').value.trim();
  if(!a||!b){ showToast('Pilih Dulu','Isi Dari & Tujuan dulu ya',true); return; }
  if(!pickupCoord) pickupCoord=await geocodeAlamat(a);
  if(!destCoord) destCoord=await geocodeAlamat(b);
  if(!pickupCoord||!destCoord){ showToast('Pilih Dulu','Pilih Dari & Tujuan dari saran / peta dulu ya, jangan cuma diketik',true); return; }
  localStorage.setItem('masphus_order',JSON.stringify({asal:{nama:a,lat:pickupCoord[0],lon:pickupCoord[1]},tujuan:{nama:b,lat:destCoord[0],lon:destCoord[1]}}));
  localStorage.removeItem('masphus_driver');
  setMauOrder(false);
  localStorage.removeItem('ammo_pending_order');
  window.location.href='penumpang.html';
}
function cekDriver(){
  if(sudahLogin()){
    simpanOrderDanLanjut();
    return;
  }
  // Belum login -> simpen pending, tandain mau order, baru buka akun
  simpanPendingOrder();
  setMauOrder(true);
  bukaAkun();
  showToast('Login Dulu','Login / Daftar dulu untuk lanjut order ya');
}
function lanjutJikaMauOrder(){
  if(!mauLanjutOrder()) return false;
  try{ pulihkanPendingOrder(); }catch(e){}
  if(!$('pickup').value.trim() || !$('dest').value.trim()) return false;
  // JANGAN GAGAL kalau koordinat ke-reset, biar simpanOrderDanLanjut yang geocode ulang
  setMauOrder(false);
  localStorage.removeItem('ammo_pending_order');
  simpanOrderDanLanjut();
  return true;
}

/* ===== AKUN ===== */
function setTab(t){
  tabAktif=t;
  $('tabLogin').className = t==='login' ? 'aktif' : '';
  $('tabDaftar').className = t==='daftar' ? 'aktif' : '';
  $('formLogin').style.display = t==='login' ? 'block' : 'none';
  $('formDaftar').style.display = t==='daftar' ? 'block' : 'none';
  $('akunSub').textContent = t==='login' ? 'Login untuk lanjut order' : 'Daftar akun baru';
}
function bukaAkun(){ $('modalAkun').classList.add('show'); }
function tutupAkun(){ $('modalAkun').classList.remove('show'); }
function doLogin(){
  let u=$('loginUser').value.trim(), p=$('loginPass').value.trim();
  if(!u||!p){ showToast('Lengkapi','Isi nama / telepon & password dulu',true); return; }
  let user={nama:u, hp:u, foto:''};
  // Cek user terdaftar kalau ada
  try{
    let list=JSON.parse(localStorage.getItem('ammo_users')||'[]');
    let ketemu=list.find(x=>x.nama===u||x.hp===u);
    if(ketemu) user=ketemu;
  }catch(e){}
  setSesi(user); tutupAkun();
  if(!lanjutJikaMauOrder()){ showToast('Berhasil','Selamat datang, '+user.nama); }
}
function doDaftar(){
  let nama=$('daftarNama').value.trim(), hp=$('daftarHp').value.trim(), pass=$('daftarPass').value.trim();
  if(!nama||!hp||!pass){ showToast('Lengkapi','Isi nama, no. telepon & password dulu',true); return; }
  let user={nama:nama, hp:hp, pass:pass, foto:''};
  try{
    let list=JSON.parse(localStorage.getItem('ammo_users')||'[]');
    list.push(user); localStorage.setItem('ammo_users',JSON.stringify(list));
  }catch(e){}
  setSesi(user); tutupAkun();
  if(!lanjutJikaMauOrder()){ showToast('Terdaftar','Akun berhasil dibuat, '+nama); }
}
function loginGoogle(){
  // Simulasi Google login - di real app ganti dengan Google Identity
  let user={nama:'User Google', hp:'', foto:''};
  setSesi(user); tutupAkun();
  if(!lanjutJikaMauOrder()){ showToast('Berhasil','Selamat datang, '+user.nama); }
}

/* Kalau balik dari penumpang dan harus clear */
if(sessionStorage.getItem('ammo_clear')==='1'){
  sessionStorage.removeItem('ammo_clear');
  $('pickup').value=''; $('dest').value=''; pickupCoord=null; destCoord=null;
  $('infoJarak').textContent='-'; $('infoEstimasi').textContent='-'; $('infoTarif').textContent='Rp. 0';
}
if(mauLanjutOrder()){ pulihkanPendingOrder(); hitungRute(); }
</script>
</body>
</html>
