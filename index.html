<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ammo Travel</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{background:#f2f2f2;display:flex;justify-content:center}
.phone{width:100%;max-width:430px;min-height:100vh;background:#fff;display:flex;flex-direction:column;position:relative;padding-bottom:78px;overflow-x:hidden}
header{background:#0DA54A;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
.logo-icon{width:42px;height:42px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.pilih{font-size:15px;font-weight:700;display:flex;align-items:center;gap:4px}
main{padding:22px 18px 10px}
h1{text-align:center;font-size:28px;line-height:1.2;color:#0B3D22;font-weight:800}
.car-center{text-align:center;font-size:32px;margin:6px 0 14px;color:#0DA54A}
label{font-size:17px;font-weight:800;color:#222;margin:14px 0 8px 38px;display:block}
.field{position:relative;margin-left:38px}
.field:before{content:"📍";position:absolute;left:-36px;top:11px;font-size:24px;color:#0DA54A}
.input-wrap{display:flex;align-items:center;background:#F3F3F3;border:1px solid #D9D9D9;border-radius:10px;padding:5px 5px 5px 12px;gap:6px}
.input-wrap input{flex:1;border:0;outline:none;background:transparent;font-size:15px;padding:10px 0;min-width:0}
.btn-peta{background:#0DA54A;color:#fff;border:0;border-radius:7px;padding:9px 10px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:3px}
.suggest{background:#fff;border-radius:14px;box-shadow:0 6px 22px rgba(0,0,0,.14);margin:12px 0 0 0;overflow:hidden;display:none}
.suggest button{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:0;padding:14px 16px;font-size:16px;cursor:pointer}
.suggest button:active{background:#f5f5f5}
.suggest .ic{color:#0DA54A;font-size:20px}
.suggest small{display:block;color:#777;font-size:12px}
.banner{background:#D9EEDF;border-radius:14px;padding:16px;margin-top:18px;display:flex;gap:12px;align-items:flex-start}
.banner .ic2{width:48px;height:48px;min-width:48px;background:#0DA54A;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
.banner p{font-size:15px;line-height:1.4;color:#111}
.btn-cek{width:100%;margin-top:14px;background:#0DA54A;color:#fff;border:0;border-radius:10px;padding:16px;font-weight:800;font-size:22px;cursor:pointer}
.btn-cek:disabled{opacity:.55}
.chat{position:fixed;bottom:92px;right:calc(50% - 195px);width:56px;height:56px;background:#0DA54A;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer;z-index:50}
.chat:after{content:"";position:absolute;top:4px;right:4px;width:10px;height:10px;background:#E53935;border-radius:50%}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#E9E9E9;display:flex;justify-content:space-around;padding:10px 0 12px;z-index:40}
nav div{text-align:center;font-size:13px;color:#777;cursor:pointer}
nav div.active{color:#0DA54A;font-weight:800}
nav .n-ic{font-size:24px;display:block}
/* MAP MODAL */
#mapModal{display:none;position:fixed;inset:0;background:#fff;z-index:100;flex-direction:column}
#mapModal.show{display:flex}
#mapModal .top{background:#0DA54A;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
#map{flex:1;width:100%}
#mapModal .bottom{padding:12px;background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.12)}
#mapModal .bottom b{font-size:14px}
#mapAddr{font-size:14px;margin:6px 0 10px;color:#333;min-height:20px}
@media(max-width:430px){.chat{right:16px}}
</style>
</head>
<body>
<div class="phone">
<header><div class="logo"><span class="logo-icon">🚗</span> Ammo Travel</div><div class="pilih">📍 Pilih Lokasi</div></header>
<main>
<h1>Mau Pergi Kemana Hari Ini?</h1>
<div class="car-center">🚗</div>

<label>Penjemputan</label>
<div class="field"><div class="input-wrap"><input id="pickup" type="text" placeholder="Ketik / Pilih Lokasi Jemput..." autocomplete="off"><button class="btn-peta" onclick="openMap('pickup')">📍 Pilih di Peta</button></div></div>
<div id="sugPickup" class="suggest"></div>

<label>Tujuan</label>
<div class="field"><div class="input-wrap"><input id="dest" type="text" placeholder="Ketik / Pilih Tujuan..." autocomplete="off"><button class="btn-peta" onclick="openMap('dest')">📍 Pilih di Peta</button></div></div>
<div id="sugDest" class="suggest"></div>

<div class="banner"><div class="ic2">🚗</div><p>Driver di sekitar kamu siap menjemput!<br>Cek harga setelah isi lokasi</p></div>
<button id="btnCek" class="btn-cek" onclick="cekDriver()">Cek Driver & Lanjut</button>
</main>
<div class="chat" onclick="alert('Chat Admin Ammo Travel')">💬</div>
<nav><div class="active"><span class="n-ic">🏠</span>Beranda</div><div><span class="n-ic">🕐</span>Riwayat</div><div><span class="n-ic">🏷️</span>Promo</div><div><span class="n-ic">👤</span>Akun</div></nav>
</div>

<!-- MODAL PETA -->
<div id="mapModal"><div class="top"><span>📍 Pilih di Peta</span><span onclick="closeMap()" style="font-size:22px;cursor:pointer">✕</span></div><div id="map"></div><div class="bottom"><b>📍 Lokasi Terpilih:</b><div id="mapAddr">Klik di peta...</div><button class="btn-cek" style="font-size:16px;padding:12px" onclick="confirmMap()">Pilih Lokasi Ini</button></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let gpsLat=-6.9175, gpsLng=107.6191, gpsReady=false;
let map=null, marker=null, mapMode='pickup', mapLat=gpsLat, mapLng=gpsLng, mapAddr='';
let pickupData=null, destData=null;

function hav(lat1,lon1,lat2,lon2){const R=6371,dLa=(lat2-lat1)*Math.PI/180,dLo=(lon2-lon1)*Math.PI/180;const a=Math.sin(dLa/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLo/2)**2;return R*2*Math.asin(Math.sqrt(a));}

// 1. GPS OTOMATIS ISI PENJEMPUTAN
function fillPickupByGPS(){
  document.getElementById('pickup').value='Mencari lokasi GPS...';
  if(!navigator.geolocation){ reverse(gpsLat,gpsLng,(a)=>{document.getElementById('pickup').value=a;}); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    gpsLat=pos.coords.latitude; gpsLng=pos.coords.longitude; gpsReady=true;
    reverse(gpsLat,gpsLng,(a)=>{ document.getElementById('pickup').value=a; pickupData={lat:gpsLat,lng:gpsLng,addr:a}; });
  },()=>{
    reverse(gpsLat,gpsLng,(a)=>{ document.getElementById('pickup').value=a; });
  },{enableHighAccuracy:true,timeout:8000});
}
function reverse(lat,lng,cb){
  fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lng+'&localityLanguage=id')
  .then(r=>r.json()).then(d=>cb(d.display_name||'')).catch(()=>cb(lat.toFixed(5)+', '+lng.toFixed(5)));
}
fillPickupByGPS();

// 2. SARAN: HILANG TOTAL, MUNCUL CUMA KALO NGETIK, 6 BUAH, URUT PALING DEKAT GPS
let timer=null;
function setupSuggest(inputId, boxId, isPickup){
  const inp=document.getElementById(inputId), box=document.getElementById(boxId);
  inp.addEventListener('input',()=>{
    const q=inp.value.trim();
    if(q.length<2){ box.style.display='none'; box.innerHTML=''; return; }
    clearTimeout(timer);
    timer=setTimeout(()=>{ searchPlace(q,box,isPickup); },350);
  });
  inp.addEventListener('focus',()=>{
    if(inp.value.trim().length>=2 && box.innerHTML) box.style.display='block';
  });
  document.addEventListener('click',(e)=>{
    if(!box.contains(e.target) && e.target!==inp) box.style.display='none';
  });
}
function searchPlace(q,box,isPickup){
  // Nominatim, viewbox di sekitar GPS, limit 6
  const dLat=0.25, dLng=0.25;
  const viewbox=(gpsLng-dLng)+','+(gpsLat+dLat)+','+(gpsLng+dLng)+','+(gpsLat-dLat);
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=15&accept-language=id&viewbox='+viewbox+'&bounded=1&q='+encodeURIComponent(q);
  fetch(url,{headers:{'Accept':'application/json'}}).then(r=>r.json()).then(list=>{
    if(!list.length){
      // fallback tanpa bounded biar tetap ada hasil
      return fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=id&q='+encodeURIComponent(q)).then(r=>r.json()).then(l2=>renderSuggest(l2,box,isPickup));
    }
    // Urutkan dari yang paling dekat GPS
    list.forEach(x=>{ x._dist=hav(gpsLat,gpsLng,parseFloat(x.lat),parseFloat(x.lon)); });
    list.sort((a,b)=>a._dist-b._dist);
    renderSuggest(list.slice(0,6),box,isPickup);
  }).catch(()=>{ box.style.display='none'; });
}
function renderSuggest(list,box,isPickup){
  if(!list.length){ box.style.display='none'; return; }
  box.innerHTML=list.map((x,i)=>`<button onclick="pickSuggest(${isPickup?1:0},${i})"><span class="ic">📍</span><span>${escapeHtml(x.display_name.split(',').slice(0,3).join(','))}<small>${escapeHtml(x.display_name)}${x._dist? ' • '+x._dist.toFixed(1)+' km dari kamu':''}</small></span></button>`).join('');
  box._data=list;
  box.style.display='block';
  window._lastBox=box; window._lastIsPickup=isPickup;
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pickSuggest(isPickup,i){
  const box=window._lastBox, item=box._data[i];
  const addr=item.display_name, lat=parseFloat(item.lat), lng=parseFloat(item.lon);
  if(isPickup){ document.getElementById('pickup').value=addr; pickupData={lat,lng,addr}; document.getElementById('sugPickup').style.display='none'; }
  else{ document.getElementById('dest').value=addr; destData={lat,lng,addr}; document.getElementById('sugDest').style.display='none'; }
}
setupSuggest('pickup','sugPickup',true);
setupSuggest('dest','sugDest',false);

// 3. PETA KLIK
function openMap(mode){
  mapMode=mode;
  document.getElementById('mapModal').classList.add('show');
  setTimeout(()=>{
    if(!map){
      map=L.map('map').setView([gpsLat,gpsLng],14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
      map.on('click',e=>{ setMapPoint(e.latlng.lat,e.latlng.lng); });
    }
    map.invalidateSize();
    const cur = mapMode==='pickup' ? pickupData : destData;
    if(cur){ map.setView([cur.lat,cur.lng],15); setMapPoint(cur.lat,cur.lng); }
    else { map.setView([gpsLat,gpsLng],14); setMapPoint(gpsLat,gpsLng); }
  },80);
}
function setMapPoint(lat,lng){
  mapLat=lat; mapLng=lng;
  if(marker) map.removeLayer(marker);
  marker=L.marker([lat,lng]).addTo(map);
  document.getElementById('mapAddr').innerText='Mencari alamat...';
  reverse(lat,lng,a=>{ mapAddr=a; document.getElementById('mapAddr').innerText=a; });
}
function closeMap(){ document.getElementById('mapModal').classList.remove('show'); }
function confirmMap(){
  const addr=mapAddr||mapLat.toFixed(6)+', '+mapLng.toFixed(6);
  if(mapMode==='pickup'){ document.getElementById('pickup').value=addr; pickupData={lat:mapLat,lng:mapLng,addr}; }
  else{ document.getElementById('dest').value=addr; destData={lat:mapLat,lng:mapLng,addr}; }
  closeMap();
}
function cekDriver(){
  const p=document.getElementById('pickup').value.trim(), d=document.getElementById('dest').value.trim();
  if(!p) return alert('Isi Penjemputan dulu ya');
  if(!d) return alert('Isi Tujuan dulu ya');
  const jarak = pickupData&&destData ? hav(pickupData.lat,pickupData.lng,destData.lat,destData.lng).toFixed(1)+' km' : '-';
  alert('Siap!\n\nPenjemputan: '+p+'\nTujuan: '+d+'\nJarak: '+jarak+'\n\nDriver di sekitar kamu siap menjemput!');
}
</script>
</body>
</html>
