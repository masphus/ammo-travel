<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMMO - Travel Penumpang</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#0a0a0a;color:#fff;font-family:system-ui,sans-serif}
  .gold{color:#D4AF37}.gold-bg{background:#D4AF37}.gold-border{border:1px solid #D4AF37}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
  .modal.show{display:flex}
  .spin{width:56px;height:56px;border:4px solid #333;border-top:4px solid #D4AF37;border-radius:50%;animation:putar 1s linear infinite;margin:0 auto}
  @keyframes putar{to{transform:rotate(360deg)}}
  input,select{color:#000!important}
</style>
</head>
<body>

<!-- HEADER -->
<header class="p-5 flex justify-between items-center">
  <h1 class="text-2xl font-extrabold gold">AMMO <span class="text-white text-sm">TRAVEL</span></h1>
  <button onclick="showPage('profil')" class="gold-bg text-black px-4 py-2 rounded-xl font-bold text-sm" id="btnAkun">Masuk</button>
</header>

<!-- BERANDA -->
<div id="page-beranda" class="px-5 pb-24 max-w-md mx-auto">
  <h2 class="font-extrabold text-xl">Mau ke mana hari ini?</h2>
  <p class="text-gray-400 text-sm">Isi penjemputan & tujuan, driver dicari otomatis.</p>

  <div class="mt-4 bg-[#1A1A1A] gold-border rounded-2xl p-4 space-y-3">
    <div>
      <label class="text-xs text-gray-400">Penjemputan</label>
      <input id="pickup" value="Bandung" class="w-full p-3 rounded-xl mt-1" placeholder="Dari mana?">
    </div>
    <div>
      <label class="text-xs text-gray-400">Tujuan</label>
      <input id="dest" value="Cimaung" class="w-full p-3 rounded-xl mt-1" placeholder="Mau ke mana?">
    </div>
    <div class="flex gap-2">
      <div class="flex-1"><label class="text-xs text-gray-400">Tanggal</label><input id="tanggalBerangkat" type="date" class="w-full p-3 rounded-xl mt-1"></div>
      <div class="flex-1"><label class="text-xs text-gray-400">Jam</label><input id="jamBerangkat" type="time" value="09:00" class="w-full p-3 rounded-xl mt-1"></div>
    </div>
    <div><label class="text-xs text-gray-400">Jumlah Orang</label>
      <select id="jumlahOrangSelect" onchange="jumlahOrang=parseInt(this.value);hitungPreview()" class="w-full p-3 rounded-xl mt-1">
        <option value="1">1 Orang</option><option value="2">2 Orang</option><option value="4">4 Orang</option><option value="6" selected>6 Orang</option>
      </select>
    </div>
  </div>

  <!-- PREVIEW HARGA -->
  <div id="ongkosPreview" class="mt-4 bg-[#1A1A1A] gold-border rounded-2xl p-4">
    <div class="flex justify-between text-sm"><span>Jarak:</span><b id="prevJarak">-</b></div>
    <div class="flex justify-between text-sm mt-1"><span>Estimasi:</span><b id="prevEstimasi">-</b></div>
    <div class="flex justify-between font-extrabold text-lg mt-2"><span>Total</span><span id="prevOngkos" class="gold">-</span></div>
    <p id="prevVoucher" class="text-xs text-green-400 mt-1">Voucher didapat: -</p>
  </div>

  <button onclick="cekDriver()" class="w-full mt-4 gold-bg text-black py-4 rounded-2xl font-extrabold">PESAN SEKARANG →</button>
  <p class="text-center text-[11px] text-gray-500 mt-2">Driver akan konfirmasi via WhatsApp</p>

  <!-- RIWAYAT -->
  <h3 class="font-bold mt-6">Riwayat Perjalanan</h3>
  <div id="list-perjalanan" class="space-y-3 mt-2"></div>
</div>

<!-- PROFIL / LOGIN PALSU (CORE) -->
<div id="page-profil" class="px-5 hidden max-w-md mx-auto">
  <h2 class="font-extrabold text-xl">Masuk</h2>
  <div class="bg-[#1A1A1A] gold-border rounded-2xl p-4 mt-4 space-y-3">
    <input id="inputNama" placeholder="Nama" class="w-full p-3 rounded-xl">
    <input id="inputHP" placeholder="No WA, cth 0812..." class="w-full p-3 rounded-xl">
    <button onclick="loginSimpel()" class="w-full gold-bg text-black py-3 rounded-xl font-bold">MASUK & LANJUT ORDER</button>
    <button onclick="showPage('beranda')" class="w-full bg-[#333] py-3 rounded-xl">Kembali</button>
  </div>
</div>

<!-- MODAL GENERIC -->
<div id="popupModal" class="modal"><div class="bg-[#1A1A1A] gold-border rounded-2xl p-6 w-full max-w-sm text-center">
  <div id="popupIcon" class="text-4xl">🎉</div>
  <h3 id="popupJudul" class="font-extrabold text-lg mt-2"></h3>
  <p id="popupIsi" class="text-sm text-gray-300 mt-2 whitespace-pre-line"></p>
  <div id="popupAksi" class="mt-4 space-y-2"></div>
</div></div>

<!-- MODAL MENCARI DRIVER -->
<div id="searchingModal" class="modal"><div class="bg-[#1A1A1A] gold-border rounded-2xl p-6 w-full max-w-sm text-center">
  <div class="spin"></div>
  <h3 class="font-extrabold text-lg mt-4">Mencari Driver...</h3>
  <p id="searchingIsi" class="text-sm text-gray-300 mt-2 whitespace-pre-line"></p>
  <p class="text-xs text-gray-500 mt-2">Status: <b id="searchingStatus" class="gold">mencari_driver</b></p>
  <button onclick="batalkanOrder()" class="w-full bg-red-600 py-3 rounded-xl font-bold mt-4">BATALKAN PESANAN</button>
</div></div>

<script>
const $=id=>document.getElementById(id);
let jumlahOrang=6, jarakKm=0, jarakMeter=0, totalHarga=0, estimasiTeks='-', durasiDetik=0, voucherDapat=0;
let pollingTimer=null, currentOrderId=null;

function showPage(p){ ['beranda','profil'].forEach(x=>$('page-'+x).classList.toggle('hidden',x!==p)); }
function getSesi(){ try{return JSON.parse(localStorage.getItem('ammo_sesi')||'null')}catch(e){return null} }
function sudahLogin(){ let s=getSesi(); return !!(s && (s.nama||s.hp)); }
function fmtRp(n){ return 'Rp '+(n||0).toLocaleString('id-ID'); }
function fmtJarak(m){ return (m/1000).toFixed(1)+' km'; }
function fmtEstimasi(d){ return Math.round(d/60)+' menit'; }

// --- HARGA (CORE, TANPA OSRM BIAR GAK GAGAL) ---
function hitungOngkos(km,orang){ let ongkos=Math.round(km*3500 + orang*5000); return {kmTagih:km, ongkos, voucher:Math.round(ongkos*0.03)}; }
function hitungPreview(){
  let a=$('pickup').value.trim(), b=$('dest').value.trim();
  if(!a||!b) return;
  // Simulasi jarak: kalau sama kota, 25km. Biar core jalan tanpa API.
  jarakMeter = (a.toLowerCase()===b.toLowerCase()) ? 5000 : 25000;
  jarakKm = jarakMeter/1000; durasiDetik = jarakKm*180; estimasiTeks = fmtEstimasi(durasiDetik);
  let h = hitungOngkos(jarakKm, jumlahOrang);
  totalHarga = h.ongkos; voucherDapat = h.voucher;
  $('prevJarak').textContent='~ '+fmtJarak(jarakMeter);
  $('prevEstimasi').textContent='± '+estimasiTeks;
  $('prevOngkos').textContent='ONGKOS '+fmtRp(totalHarga);
  $('prevVoucher').textContent='Voucher didapat: + '+fmtRp(voucherDapat);
}

// --- LOGIN ---
function loginSimpel(){
  let nama=$('inputNama').value.trim(), hp=$('inputHP').value.trim();
  if(!nama||!hp){ alert('Isi nama & WA dulu'); return; }
  localStorage.setItem('ammo_sesi', JSON.stringify({nama, hp}));
  $('btnAkun').textContent=nama;
  showPage('beranda');
  // Kalau tadi mau order, lanjut otomatis
  if(localStorage.getItem('ammo_mau_order')==='1'){ localStorage.setItem('ammo_mau_order','0'); simpanOrderDanLanjut(); }
}
function simpanPendingOrder(){ localStorage.setItem('ammo_pending_order', JSON.stringify({asal:$('pickup').value, tujuan:$('dest').value})); }

// --- POPUP ---
function bukaPopup(judul,isi,icon,aksi){
  $('popupJudul').textContent=judul; $('popupIsi').textContent=isi; $('popupIcon').textContent=icon||'🎉';
  $('popupAksi').innerHTML='';
  (aksi||[{label:'Tutup',aksi:'ke-beranda'}]).forEach(a=>{
    let btn=document.createElement('button');
    btn.className='w-full gold-bg text-black py-3 rounded-xl font-bold'; btn.textContent=a.label;
    btn.onclick=()=>{ $('popupModal').classList.remove('show'); if(a.aksi==='ke-beranda') showPage('beranda'); };
    $('popupAksi').appendChild(btn);
  });
  $('popupModal').classList.add('show');
}
function popupError(judul,isi){ bukaPopup(judul,isi,'⚠️',[{label:'OK',aksi:'ke-beranda'}]); }

// --- INI YANG DIPERBAIKI ---
async function cekDriver(){
  let a=$('pickup').value.trim(), b=$('dest').value.trim();
  if(!a||!b){ popupError('Lengkapi Data','Isi Penjemputan dan Tujuan dulu.'); return; }
  if(!sudahLogin()){
    simpanPendingOrder(); localStorage.setItem('ammo_mau_order','1'); showPage('profil'); return;
  }
  await simpanOrderDanLanjut();
}

async function simpanOrderDanLanjut(){
  let a=$('pickup').value.trim(), b=$('dest').value.trim();
  let tgl=$('tanggalBerangkat').value || new Date().toISOString().slice(0,10);
  let jam=$('jamBerangkat').value || '09:00';
  let sesi=getSesi();
  if(!a||!b){ popupError('Lengkapi Data','Isi Penjemputan dan Tujuan dulu.'); return; }
  hitungPreview();

  // STATUS AWAL = mencari_driver, BUKAN selesai!
  let order={
    id:'ORD-'+Date.now(),
    asal:{nama:a}, tujuan:{nama:b},
    waktu:Date.now(), jarak_km:jarakKm, jarak_meter:jarakMeter,
    total_harga:totalHarga, estimasi:estimasiTeks, jumlah_orang:jumlahOrang,
    tanggal_berangkat:tgl, jam_berangkat:jam,
    nama_penumpang:sesi?sesi.nama:null, no_wa:sesi?sesi.hp:null,
    status:'mencari_driver', driver_nama:null
  };
  currentOrderId=order.id;
  localStorage.setItem('masphus_order', JSON.stringify(order));
  localStorage.setItem('ammo_mau_order','0');

  // TAMPILKAN MENCARI DRIVER, BUKAN Pesanan Berhasil
  $('searchingIsi').textContent = a+' → '+b+'\n'+jumlahOrang+' Orang • '+fmtJarak(jarakMeter)+'\nTotal: '+fmtRp(totalHarga);
  $('searchingStatus').textContent='mencari_driver';
  $('searchingModal').classList.add('show');

  // Coba kirim ke Supabase kalau ada (kalau gagal, tetap jalan lokal)
  try{
    if(window.supabaseClient){
      await supabaseClient.from('orders').insert([{
        id:order.id, asal:a, tujuan:b, total_harga:totalHarga,
        jumlah_orang:jumlahOrang, tanggal_berangkat:tgl, jam_berangkat:jam, status:'mencari_driver'
      }]);
    }
  }catch(e){ console.log('Supabase orders belum ada, pakai lokal',e); }

  mulaiPollingDriver(order.id);
  renderPerjalanan();
}

function mulaiPollingDriver(orderId){
  if(pollingTimer) clearInterval(pollingTimer);
  pollingTimer=setInterval(async()=>{
    // 1. Cek Supabase dulu kalau ada
    try{
      if(window.supabaseClient){
        let {data} = await supabaseClient.from('orders').select('status,driver_nama').eq('id',orderId).maybeSingle();
        if(data && data.status!=='mencari_driver'){ driverDitemukan(data); return; }
      }
    }catch(e){}
    // 2. Simulasi demo: setelah 8 detik, anggap driver ketemu (hapus blok ini kalau sudah ada driver.html asli)
    let o=JSON.parse(localStorage.getItem('masphus_order')||'{}');
    if(o && o.id===orderId && Date.now()-o.waktu>8000){
      o.status='diterima'; o.driver_nama='Budi - D 1234 AB';
      localStorage.setItem('masphus_order', JSON.stringify(o));
      driverDitemukan(o);
    }
  },2000);
}

function driverDitemukan(data){
  if(pollingTimer) clearInterval(pollingTimer);
  $('searchingModal').classList.remove('show');
  bukaPopup('Driver Ditemukan!','Driver '+(data.driver_nama||'Anda')+' akan menjemput Anda.\nStatus: '+data.status,'🚗',[{label:'LIHAT RIWAYAT',aksi:'ke-beranda'}]);
  renderPerjalanan();
}

function batalkanOrder(){
  if(pollingTimer) clearInterval(pollingTimer);
  let o=JSON.parse(localStorage.getItem('masphus_order')||'{}');
  if(o && o.id===currentOrderId){ o.status='dibatalkan'; localStorage.setItem('masphus_order', JSON.stringify(o)); }
  $('searchingModal').classList.remove('show');
  bukaPopup('Pesanan Dibatalkan','Pesanan dibatalkan.','❌',[{label:'OK',aksi:'ke-beranda'}]);
  renderPerjalanan();
}

function renderPerjalanan(){
  let el=$('list-perjalanan');
  let raw=localStorage.getItem('masphus_order');
  if(!raw){ el.innerHTML='<p class="text-gray-400 text-sm">Belum ada riwayat perjalanan</p>'; return; }
  let p=JSON.parse(raw);
  let label = p.status==='mencari_driver' ? '🔍 Mencari Driver' : p.status==='diterima' ? '🚗 Driver Ditemukan' : p.status==='dibatalkan' ? '❌ Dibatalkan' : '✅ '+p.status;
  let warna = p.status==='mencari_driver' ? 'text-yellow-400' : p.status==='diterima' ? 'text-green-400' : 'text-gray-400';
  el.innerHTML='<div class="bg-[#111] gold-border rounded-[20px] p-4"><div class="flex justify-between"><b>'+p.asal.nama+' → '+p.tujuan.nama+'</b><span class="'+warna+' text-xs font-bold">'+label+'</span></div><p class="text-sm text-gray-400 mt-1">'+p.jumlah_orang+' Orang • '+fmtJarak(p.jarak_meter)+' • '+fmtRp(p.total_harga)+'</p><p class="text-xs text-gray-500">'+new Date(p.waktu).toLocaleString('id-ID')+'</p></div>';
}

// INIT
$('tanggalBerangkat').value=new Date().toISOString().slice(0,10);
hitungPreview(); renderPerjalanan();
let s=getSesi(); if(s) $('btnAkun').textContent=s.nama;
</script>
</body>
</html>
