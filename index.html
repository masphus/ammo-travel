<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ammo Travel</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#f0f7f0;padding:14px}
.box{background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
label{font-weight:700;font-size:13px}select,input{width:100%;padding:13px;border:2px solid #ddd;border-radius:12px;margin:6px 0 12px;font-size:15px}
.harga{font-size:26px;font-weight:800;color:#0a7a2e;text-align:center;margin:10px}
button{width:100%;padding:16px;background:#0a7a2e;color:#fff;border:0;border-radius:12px;font-size:16px;font-weight:700;margin-top:10px;cursor:pointer}
.tipe{display:flex;gap:8px}.tipe button{background:#eee;color:#333}.tipe button.on{background:#0a7a2e;color:#fff}
</style></head>
<body>
<h2 style="text-align:center">🚗 AMMO TRAVEL</h2>
<p style="text-align:center;color:#666">Travel Soreang - Bandung - Dago</p>
<div class="box">
<label>Dari</label>
<select id="dari"><option>Soreang</option><option>Bandung</option><option>Dago</option><option>Cimahi</option></select>
<label>Ke</label>
<select id="ke"><option>Dago</option><option>Soreang</option><option>Bandung</option><option>Cimahi</option></select>
<label>Tipe Perjalanan</label>
<div class="tipe"><button type="button" id="bBersama" class="on" onclick="setTipe('bersama')">👥 Bersama</button><button type="button" id="bPrivate" onclick="setTipe('private')">🚗 Private</button></div>
<label style="margin-top:12px;display:block">Jumlah Kursi</label>
<select id="kursi"><option>1</option><option>2</option><option>3</option><option>4</option></select>
<div class="harga" id="hargaTampil">Rp 35.000</div>
<p id="ketHarga" style="text-align:center;font-size:12px;color:#666"></p>
<button onclick="cari()">🔍 Cari Driver →</button>
</div>
<script>
let tipe='bersama';
let TARIF={
 'Soreang-Dago':{bersama:35000,private:120000},
 'Dago-Soreang':{bersama:35000,private:120000},
 'Soreang-Bandung':{bersama:30000,private:100000},
 'Bandung-Soreang':{bersama:30000,private:100000},
 'Soreang-Cimahi':{bersama:30000,private:100000},
 'Cimahi-Soreang':{bersama:30000,private:100000},
 'Bandung-Dago':{bersama:25000,private:90000},
 'Dago-Bandung':{bersama:25000,private:90000}
};
function setTipe(t){tipe=t;document.getElementById('bBersama').classList.toggle('on',t=='bersama');document.getElementById('bPrivate').classList.toggle('on',t=='private');updateHarga();}
function hitung(){
  let dari=document.getElementById('dari').value;
  let ke=document.getElementById('ke').value;
  let kursi=parseInt(document.getElementById('kursi').value)||1;
  let kunci=dari+'-'+ke;
  let t=TARIF[kunci];
  if(!t){ if(tipe=='private') return {total:100000,ket:'Private • Harga flat'}; return {total:30000*kursi,ket:'Bersama • Rp 30.000 / kursi'}; }
  if(tipe=='private') return {total:t.private,ket:'Private • Harga flat 1 mobil'};
  return {total:t.bersama*kursi,ket:'Bersama • Rp '+t.bersama.toLocaleString('id-ID')+' / kursi x '+kursi};
}
function updateHarga(){
  let h=hitung();
  document.getElementById('hargaTampil').innerText='Rp '+h.total.toLocaleString('id-ID');
  document.getElementById('ketHarga').innerText=h.ket;
}
document.getElementById('dari').onchange=updateHarga;
document.getElementById('ke').onchange=updateHarga;
document.getElementById('kursi').onchange=updateHarga;
updateHarga();
function cari(){
  let dari=document.getElementById('dari').value;
  let ke=document.getElementById('ke').value;
  let kursi=document.getElementById('kursi').value;
  let h=hitung();
  let harga='Rp '+h.total.toLocaleString('id-ID');
  location.href='pembayaran.html?tipe='+tipe+'&dari='+encodeURIComponent(dari)+'&ke='+encodeURIComponent(ke)+'&kursi='+kursi+'&harga='+encodeURIComponent(harga);
}
</script>
</body></html>
