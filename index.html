.card b{font-size:16px;line-height:1.4;color:#222;font-weight:500}
.btn-lanjut{width:100%;background:#0a9e4e;color:#fff;border:0;border-radius:12px;padding:18px;font-size:24px;font-weight:900;margin-top:16px;cursor:pointer}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#eee;display:flex;justify-content:space-around;padding:12px 0 14px;border-top:1px solid #ddd;z-index:30}

.overlay-peta{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:99;padding:12px}
.overlay-peta.show{display:flex}
.popup-peta{background:#fff;border-radius:18px;width:100%;max-width:440px;overflow:hidden}
.popup-peta-head{padding:14px;font-weight:900;font-size:18px;text-align:center}
#mapPicker{width:100%;height:340px;background:#e8f5e9}
.peta-alamat{padding:12px;font-size:13px;line-height:1.5;background:#f9f9f9;min-height:58px;word-break:break-word}
.btn-peta-pilih{width:calc(100% - 24px);margin:0 12px 8px;background:#0a9e4e;color:#fff;border:0;border-radius:12px;padding:14px;font-weight:900;font-size:16px;cursor:pointer}
.btn-peta-batal{width:calc(100% - 24px);margin:0 12px 12px;background:#eee;border:0;border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
</style></head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var latDari=0,lngDari=0,latKe=0,lngKe=0;
var timerDari=null,timerKe=null;
var JUMLAH_SARAN = 6;
function hitungJarakKm(a,b,c,d){var R=6371;var dLat=(c-a)*Math.PI/180;var dLon=(d-b)*Math.PI/180;var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function formatJarak(km){ if(km<1) return Math.round(km*1000)+' m'; return km.toFixed(1).replace('.',',')+' km'; }
function titikAcuan(tipe){ if(tipe==='ke' && latDari && lngDari) return {lat:latDari,lon:lngDari}; if(tipe==='dari' && latKe && lngKe) return {lat:latKe,lon:lngKe}; return {lat:-6.9175,lon:107.6191}; }
function formatAlamatLengkap(data, lat, lng){
  if(!data) return lat.toFixed(5)+', '+lng.toFixed(5);
  var a = data.address || {};
  var bagian = [];
  if(a.road) bagian.push((a.house_number ? a.road + ' No. ' + a.house_number : a.road));
  if(a.suburb) bagian.push(a.suburb);
  else if(a.neighbourhood) bagian.push(a.neighbourhood);
  if(a.city_district) bagian.push(a.city_district);
  if(a.city) bagian.push(a.city);
  else if(a.town) bagian.push(a.town);
  else if(a.village) bagian.push(a.village);
  if(a.state) bagian.push(a.state);
  if(a.postcode) bagian.push(a.postcode);
  if(!bagian.length) return data.display_name || (lat.toFixed(5)+', '+lng.toFixed(5));
  return bagian.join(', ');
}
function cariSaranMapsAsli(teks, tipe, callback){
  var acuan = titikAcuan(tipe);
  fetch('https://photon.komoot.io/api/?q='+encodeURIComponent(teks)+'&limit=20&lat='+acuan.lat+'&lon='+acuan.lon+'&lang=id')
    .then(function(r){ return r.json(); }).then(function(data){
      if(data && data.features && data.features.length){
        var list=[];
        var seen={};
        for(var i=0;i<data.features.length;i++){
          var f=data.features[i]; var p=f.properties||{}; var c=f.geometry.coordinates;
          var nama = p.name || p.street || 'Lokasi';
          var kec = '';
          if(p.district) kec+=p.district;
          if(p.city) kec+=(kec?', ':'')+p.city;
          if(p.county) kec+=(kec?', ':'')+p.county;
          if(p.state) kec+=(kec?', ':'')+p.state;
          var alamat = '';
          if(p.street) alamat+=p.street;
          if(p.housenumber) alamat+=' No. '+p.housenumber;
          if(p.district) alamat+=(alamat?', ':'')+p.district;
          if(p.city) alamat+=(alamat?', ':'')+p.city;
          if(p.county) alamat+=(alamat?', ':'')+p.county;
          if(p.state) alamat+=(alamat?', ':'')+p.state;
          if(p.postcode) alamat+=(alamat?', ':'')+p.postcode;
          if(!alamat) alamat = kec || (p.country || 'Indonesia');
          var kunci = nama.toLowerCase()+'|'+kec.toLowerCase();
          if(seen[kunci]) continue;
          seen[kunci]=true;
          list.push({nama:nama, alamat:alamat, kec:kec, lat:c[1], lon:c[0], _jarak:hitungJarakKm(acuan.lat, acuan.lon, c[1], c[0])});
        }
        list.sort(function(a,b){ return a._jarak - b._jarak; });
        callback(list.slice(0, JUMLAH_SARAN));
      } else {
        return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=10&countrycodes=id&q='+encodeURIComponent(teks))
          .then(function(r){ return r.json(); }).then(function(d2){
            var list2=[]; var seen2={};
            for(var k=0;k<(d2||[]).length;k++){
              var nf=d2[k].display_name||''; var bg=nf.split(',');
              var nama2=(bg[0]||'').trim();
              var kunci2=nf.toLowerCase();
              if(seen2[kunci2]) continue; seen2[kunci2]=true;
              list2.push({nama:nama2, alamat:nf, kec:bg.slice(1,4).join(',').trim(), lat:parseFloat(d2[k].lat), lon:parseFloat(d2[k].lon), _jarak:hitungJarakKm(acuan.lat, acuan.lon, parseFloat(d2[k].lat), parseFloat(d2[k].lon))});
            }
            list2.sort(function(a,b){ return a._jarak - b._jarak; });
            callback(list2.slice(0, JUMLAH_SARAN));
          });
      }
    }).catch(function(){
      fetch('https://nominatim.openstreetmap.org/search?format=json&limit=10&countrycodes=id&q='+encodeURIComponent(teks))
        .then(function(r){ return r.json(); }).then(function(d2){
          var list2=[];
          for(var k=0;k<(d2||[]).length;k++){
            var nf=d2[k].display_name||''; var bg=nf.split(',');
            list2.push({nama:(bg[0]||'').trim(), alamat:nf, kec:bg.slice(1,4).join(',').trim(), lat:parseFloat(d2[k].lat), lon:parseFloat(d2[k].lon), _jarak:hitungJarakKm(acuan.lat, acuan.lon, parseFloat(d2[k].lat), parseFloat(d2[k].lon))});
          }
          list2.sort(function(a,b){ return a._jarak - b._jarak; });
          callback(list2.slice(0, JUMLAH_SARAN));
        }).catch(function(){ callback([]); });
    });
}
function tampilkanSaran(inputEl, saranEl, list, teks, tipe){
  if(!list.length){
    saranEl.innerHTML='<div class="saran-kosong">Tidak ketemu.<br>Coba ketik lengkap: "'+teks+' Cimaung" atau "'+teks+' Camp
