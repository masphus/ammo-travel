<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ammo Travel</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f2f2;display:flex;justify-content:center}
.phone{width:100%;max-width:430px;min-height:100vh;background:#fff;display:flex;flex-direction:column;padding-bottom:78px}
header{background:#0DA54A;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.logo{display:flex;gap:10px;align-items:center;font-size:22px;font-weight:800}
.logo img{width:44px;height:44px;border-radius:50%;background:#fff;object-fit:cover}
main{padding:22px 18px 10px}
h1{text-align:center;font-size:28px;color:#0B3D22}
label{font-size:17px;font-weight:800;margin:14px 0 8px 38px;display:block}
.field{margin-left:38px;position:relative}
.field:before{content:"📍";position:absolute;left:-36px;top:11px;font-size:24px}
.wrap{display:flex;background:#F3F3F3;border:1px solid #D9D9D9;border-radius:10px;padding:5px 5px 5px 12px;gap:6px}
.wrap input{flex:1;border:0;outline:none;background:transparent;font-size:15px;padding:10px 0}
.btn{border:0;background:#0DA54A;color:#fff;border-radius:7px;padding:9px 8px;font-weight:700;font-size:13px;white-space:nowrap}
.gpsbtn{margin:8px 0 0 38px;background:#E6F7EC;color:#0B7A35;border:1px solid #BDE8C8;border-radius:8px;padding:8px 10px;font-weight:700;width:calc(100% - 38px)}
.sug{background:#fff;border-radius:14px;box-shadow:0 6px 22px rgba(0,0,0,.14);display:none;overflow:hidden;margin-top:10px}
.sug button{width:100%;display:flex;gap:12px;text-align:left;background:#fff;border:0;padding:14px 16px;font-size:15px}
.sug small{display:block;color:#777;font-size:12px}
.radar-box{background:#D9EEDF;border-radius:14px;padding:16px;margin-top:18px;display:flex;gap:14px;align-items:center}
.radar{width:64px;height:64px;min-width:64px;border-radius:50%;background:#0DA54A;position:relative;overflow:hidden;border:3px solid #fff}
.radar:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,255,255,.95),transparent 80deg);animation:spin 1.2s linear infinite}
.radar:before{content:"";position:absolute;inset:18px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.radar-dot{position:absolute;left:50%;top:50%;width:8px;height:8px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);z-index:2}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-cek{width:100%;margin-top:14px;background:#0DA54A;color:#fff;border:0;border-radius:10px;padding:16px;font-weight:800;font-size:22px}
.chat{position:fixed;bottom:92px;right:16px;width:56px;height:56px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;z-index:50;text-decoration:none}
nav{position:fixed;bottom:0;width:100%;max-width:430px;background:#E9E9E9;display:flex;justify-content:space-around;padding:10px 0 12px}
nav div{text-align:center;font-size:13px;color:#777}
nav div.on{color:#0DA54A;font-weight:800}
#mapModal{display:none;position:fixed;inset:0;background:#fff;z-index:100;flex-direction:column}
#mapModal.show{display:flex}
#mapModal .top{background:#0DA54A;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;font-weight:800}
#map{flex:1}
#mapModal .bottom{padding:12px}
#mapAddr{font-size:14px;margin:6px 0 10px}
</style>
</head>
<body>
<div class="phone">
<header><div class="logo"><img src="icon-512.png">Ammo Travel</div><div>📍 Pilih Lokasi</div></header>
<main>
<h1>Mau Pergi Kemana Hari Ini?</h1>
<label>Penjemputan</label>
<div class="field"><div class="wrap"><input id="pickup" placeholder="Ketik / Pilih Lokasi Jemput..."><button class="btn" onclick="openMap('pickup')">PETA</button></div></div>
<button class="gpsbtn" onclick="useGPS()">📍 Pakai GPS Saya</button>
<div id="sugPickup" class="sug"></div>
<label>Tujuan</label>
<div class="field"><div class="wrap"><input id="dest" placeholder="Ketik / Pilih Tujuan..."><button class="btn" onclick="openMap('dest')">PETA</button></div></div>
<div id="sugDest" class="sug"></div>
<div class="radar-box"><div class="radar"><div class="radar-dot"></div></div><p><b>Sedang Mencari Driver...</b><br>Driver di sekitar kamu siap menjemput!</p></div>
<button class="btn-cek" onclick="cekDriver()">Cek Driver & Lanjut</button>
</main>
<a class="chat" href="#" onclick="alert('Chat Admin - Segera Hadir');return false">💬</a>
<nav><div class="on">🏠<br>Beranda</div><div>🕐<br>Riwayat</div><div>🏷️<br>Promo</div><div>👤<br>Akun</div></nav>
</div>
<div id="mapModal"><div class="top"><span>📍 Pilih di Peta</span><span onclick="closeMap()">✕</span></div><div id="map"></div><div class="bottom"><b>📍 Lokasi Terpilih:</b><div id="mapAddr">Klik di peta...</div><button class="btn-cek" style="font-size:16px;padding:12px" onclick="confirmMap()">Pilih Lokasi Ini</button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script> 
  <script>
let gpsLat=-6.9175,gpsLng=107.6191,map=null,marker=null,mapMode='pickup',mapLat=gpsLat,mapLng=gpsLng,mapAddr='',pickupData=null,destData=null;
function hav(a,b,c,d){const R=6371,e=(c-a)*Math.PI/180,f=(d-b)*Math.PI/180;const g=Math.sin(e/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(f/2)**2;return R*2*Math.asin(Math.sqrt(g))}
function rev(lat,lng,cb){fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+lat+'&lon='+lng+'&accept-language=id&zoom=18').then(r=>r.json()).then(d=>cb(d.display_name||'')).catch(()=>cb(''))}
function useGPS(){const i=document.getElementById('pickup');i.value='📍 Mencari GPS...';navigator.geolocation.getCurrentPosition(p=>{gpsLat=p.coords.latitude;gpsLng=p.coords.longitude;i.value='📍 Mencari alamat...';rev(gpsLat,gpsLng,a=>{i.value=a||'Lokasi Saya';pickupData={lat:gpsLat,lng:gpsLng,addr:a}})},()=>{i.value=''})}
if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{gpsLat=p.coords.latitude;gpsLng=p.coords.longitude;const i=document.getElementById('pickup');if(!i.value){i.value='📍 Mencari alamat...';rev(gpsLat,gpsLng,a=>{if(a){i.value=a;pickupData={lat:gpsLat,lng:gpsLng,addr:a}}else{i.value=''}})}},()=>{})}
let timer=null;
function setup(id,boxId,isPick){const inp=document.getElementById(id),box=document.getElementById(boxId);inp.addEventListener('input',()=>{const q=inp.value.trim();if(q.length<2){box.style.display='none';return}clearTimeout(timer);timer=setTimeout(()=>search(q,box,isPick),350)})}
function search(q,box,isPick){const vb=(gpsLng-.45)+','+(gpsLat+.45)+','+(gpsLng+.45)+','+(gpsLat-.45);const u1='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=15&accept-language=id&viewbox='+vb+'&bounded=1&q='+encodeURIComponent(q);const u2='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=15&accept-language=id&countrycodes=id&q='+encodeURIComponent(q);Promise.all([fetch(u1).then(r=>r.json()),fetch(u2).then(r=>r.json())]).then(([n,a])=>{let g=[...n,...a],s={};g=g.filter(x=>{let k=x.lat+','+x.lon;if(s[k])return false;s[k]=1;return true});g.forEach(x=>x._d=hav(gpsLat,gpsLng,parseFloat(x.lat),parseFloat(x.lon)));g.sort((a,b)=>a._d-b._d);let d=g.filter(x=>x._d<30);let h=d.length?d:g.slice(0,6);render(h.slice(0,6),box,isPick)})}
function render(list,box,isPick){if(!list.length){box.style.display='none';return}box.innerHTML=list.map((x,i)=>'<button onclick="pickS('+isPick+','+i+')"><span>📍</span><span>'+x.display_name.split(',').slice(0,3).join(',')+'<small>'+x.display_name+' • '+x._d.toFixed(1)+' km</small></span></button>').join('');box._d=list;box.style.display='block';window._b=box}
function pickS(isPick,i){const it=window._b._d[i];if(isPick){document.getElementById('pickup').value=it.display_name;pickupData={lat:parseFloat(it.lat),lng:parseFloat(it.lon),addr:it.display_name};document.getElementById('sugPickup').style.display='none'}else{document.getElementById('dest').value=it.display_name;destData={lat:parseFloat(it.lat),lng:parseFloat(it.lon),addr:it.display_name};document.getElementById('sugDest').style.display='none'}}
setup('pickup','sugPickup',1);setup('dest','sugDest',0);
function openMap(m){mapMode=m;document.getElementById('mapModal').classList.add('show');setTimeout(()=>{if(!map){map=L.map('map').setView([gpsLat,gpsLng],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);map.on('click',e=>setP(e.latlng.lat,e.latlng.lng))}map.invalidateSize();const cur=mapMode==='pickup'?pickupData:destData;if(cur){map.setView([cur.lat,cur.lng],15);setP(cur.lat,cur.lng)}else{map.setView([gpsLat,gpsLng],14);setP(gpsLat,gpsLng)}},80)}
function setP(lat,lng){mapLat=lat;mapLng=lng;if(marker)map.removeLayer(marker);marker=L.marker([lat,lng]).addTo(map);document.getElementById('mapAddr').innerText='Mencari alamat...';rev(lat,lng,a=>{mapAddr=a||('Pin - '+lat.toFixed(6)+', '+lng.toFixed(6));document.getElementById('mapAddr').innerText=mapAddr})}
function closeMap(){document.getElementById('mapModal').classList.remove('show')}
function confirmMap(){const a=mapAddr||mapLat.toFixed(6)+', '+mapLng.toFixed(6);if(mapMode==='pickup'){document.getElementById('pickup').value=a;pickupData={lat:mapLat,lng:mapLng,addr:a}}else{document.getElementById('dest').value=a;destData={lat:mapLat,lng:mapLng,addr:a}}closeMap()}
function cekDriver(){const p=document.getElementById('pickup').value.trim(),d=document.getElementById('dest').value.trim();if(!p)return alert('Isi Penjemputan dulu ya');if(!d)return alert('Isi Tujuan dulu ya');const j=pickupData&&destData?hav(pickupData.lat,pickupData.lng,destData.lat,destData.lng).toFixed(1)+' km':'-';alert('Siap!\nPenjemputan: '+p+'\nTujuan: '+d+'\nJarak: '+j)}
</script> 
<script>
function search(q,box,isPick){
  const uEsri='https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&outFields=LongLabel,Match_addr&SingleLine='+encodeURIComponent(q+', Indonesia')+'&maxLocations=10';
  const u2='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&accept-language=id&countrycodes=id&q='+encodeURIComponent(q)+'&viewbox='+(gpsLng-0.3)+','+(gpsLat+0.3)+','+(gpsLng+0.3)+','+(gpsLat-0.3)+'&bounded=0';
  const u3='https://photon.komoot.io/api/?q='+encodeURIComponent(q)+'&lat='+gpsLat+'&lon='+gpsLng+'&limit=10&lang=id';
  Promise.all([fetch(uEsri).then(r=>r.json()).catch(()=>({candidates:[]})),fetch(u2).then(r=>r.json()).catch(()=>[]),fetch(u3).then(r=>r.json()).catch(()=>({features:[]}))]).then(([e,n,p])=>{
    let es=(e.candidates||[]).map(c=>({display_name:(c.attributes && (c.attributes.LongLabel || c.attributes.Match_addr)) || c.address,lat:c.location.y,lon:c.location.x}));
    let ph=(p.features||[]).map(f=>({display_name:[f.properties.name,f.properties.street,f.properties.city,f.properties.state].filter(Boolean).join(', '),lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0]}));
    let g=[...ph,...es,...n];
    g.forEach(x=>x._d=hav(gpsLat,gpsLng,parseFloat(x.lat),parseFloat(x.lon)));
    g.sort((a,b)=>a._d-b._d);
    let out=[];
    for(let x of g){
      let duplikat = out.some(y => hav(y.lat,y.lon,x.lat,x.lon) < 0.5);
      if(!duplikat) out.push(x);
      if(out.length>=6) break;
    }
    render(out,box,isPick)
  })
}
</script>
</body>
