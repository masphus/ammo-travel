<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masphus Travel - Order</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f0fdf4;color:#14532d}
header{background:#15803d;color:white;padding:14px;text-align:center;font-weight:bold;font-size:20px}
.card{background:white;margin:12px;padding:16px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
label{font-weight:bold;font-size:14px}
input{width:100%;padding:12px;margin:6px 0 10px;border-radius:10px;border:1px solid #ccc;font-size:16px}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border:none;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer}
.green{background:#15803d;color:white}
.light{background:#dcfce7;color:#14532d}
.saran{border:1px solid #eee;border-radius:10px;overflow:hidden;margin-top:-8px;margin-bottom:10px}
.saran div{padding:10px;background:white;border-bottom:1px solid #eee;cursor:pointer;font-size:14px}
.saran div:hover{background:#f0fdf4}
#map{height:280px;border-radius:12px;margin:8px 0;display:none}
.estimasi{background:#fef9c3;padding:12px;border-radius:12px;font-size:14px;line-height:1.6}
.small{font-size:12px;text-align:center;color:#666}
</style>
</head>
<body>
<header>🚐 Masphus Travel</header>

<div class="card">
  <label>📍 Penjemputan (Otomatis GPS)</label>
  <input id="pickup" placeholder="Mendeteksi GPS...">
  <div id="saranPickup" class="saran"></div>
  <button class="btn light" onclick="bukaPeta('pickup')">🗺️ Pilih di Peta</button>

  <label>🎯 Tujuan</label>
  <input id="tujuan" placeholder="Ketik tujuan...">
  <div id="saranTujuan" class="saran"></div>
  <button class="btn light" onclick="bukaPeta('tujuan')">🗺️ Pilih di Peta</button>

  <div id="map"></div>

  <div id="boxEstimasi" class="estimasi" style="display:none"></div>

  <!-- TOMBOL BARU - CUMA INI YANG DIUBAH -->
  <button class="btn green" id="btnOrder" onclick="orderNow()">ORDER NOW</button>

  <p class="small">Chat Admin ketik #driver / #admin di chat</p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ===== STATE =====
let pickupCoord = null, tujuanCoord = null, targetPeta = 'pickup';
let map = null, markerPickup = null, markerTujuan = null;

// ===== 1. GPS OTOMATIS - JANGAN DIUBAH =====
function isiPenjemputanOtomatis(){
  const el = document.getElementById('pickup');
  if(!navigator.geolocation){ el.placeholder = 'GPS tidak aktif'; return; }
  el.value = 'Mendeteksi GPS...';
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    pickupCoord = {lat, lon};
    // Lapis 1: Nominatim reverse
    try{
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`,{headers:{'Accept':'application/json'}});
      const j = await r.json();
      if(j && j.display_name){ el.value = j.display_name; hitungEstimasi(); return; }
      throw new Error('nominatim kosong');
    }catch(e){
      // Lapis 2: BigDataCloud cadangan
      try{
        const r2 = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=id`);
        const j2 = await r2.json();
        el.value = (j2.locality || '') + ', ' + (j2.city || '') + ', ' + (j2.principalSubdivision || '') + ', ' + (j2.countryName || '');
        hitungEstimasi();
      }catch(e2){ el.value = lat + ', ' + lon; }
    }
  }, ()=>{ el.value = ''; el.placeholder = 'Aktifkan GPS / ketik manual'; });
}

// ===== 2. AUTOCOMPLETE NOMINATIM =====
async function cariAlamat(q, boxId, inputId){
  const box = document.getElementById(boxId);
  if(q.length < 3){ box.innerHTML=''; return; }
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=id&limit=5&addressdetails=1`);
    const list = await r.json();
    box.innerHTML = list.map((x,i)=>`<div onclick="pilihSaran(${x.lat},${x.lon},'${x.display_name.replace(/'/g,"")}','${inputId}','${boxId}')">${x.display_name}</div>`).join('');
  }catch(e){}
}
function pilihSaran(lat,lon,nama,inputId,boxId){
  document.getElementById(inputId).value = nama;
  document.getElementById(boxId).innerHTML = '';
  if(inputId==='pickup') pickupCoord={lat,lon}; else tujuanCoord={lat,lon};
  hitungEstimasi();
}
document.getElementById('pickup').addEventListener('input', e=>cariAlamat(e.target.value,'saranPickup','pickup'));
document.getElementById('tujuan').addEventListener('input', e=>cariAlamat(e.target.value,'saranTujuan','tujuan'));

// ===== 3. PETA LEAFLET =====
function bukaPeta(target){
  targetPeta = target;
  document.getElementById('map').style.display='block';
  if(!map){
    const c = pickupCoord || {lat:-6.9175, lon:107.6191};
    map = L.map('map').setView([c.lat,c.lon], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
    map.on('click', async (e)=>{
      const lat=e.latlng.lat, lon=e.latlng.lng;
      if(targetPeta==='pickup'){ pickupCoord={lat,lon}; if(markerPickup) map.removeLayer(markerPickup); markerPickup=L.marker([lat,lon]).addTo(map).bindPopup('Jemput').openPopup(); }
      else { tujuanCoord={lat,lon}; if(markerTujuan) map.removeLayer(markerTujuan); markerTujuan=L.marker([lat,lon]).addTo(map).bindPopup('Tujuan').openPopup(); }
      // Reverse via Nominatim
      try{
        const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18`);
        const j=await r.json();
        document.getElementById(targetPeta).value = j.display_name || (lat+', '+lon);
      }catch(e){}
      hitungEstimasi();
    });
  }
  setTimeout(()=>map.invalidateSize(),200);
}

// ===== 4. OSRM - JARAK + ONGKOS - JANGAN DIUBAH =====
async function hitungEstimasi(){
  if(!pickupCoord || !tujuanCoord) return;
  try{
    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${pickupCoord.lon},${pickupCoord.lat};${tujuanCoord.lon},${tujuanCoord.lat}?overview=false`);
    const j = await r.json();
    if(j.routes && j.routes[0]){
      const jarakKm = j.routes[0].distance/1000;
      const durasiMenit = Math.round(j.routes[0].duration/60);
      const ongkos = Math.round(jarakKm * 5000 + 10000);
      window._orderData = { pickup: document.getElementById('pickup').value, tujuan: document.getElementById('tujuan').value, pickupCoord, tujuanCoord, jarakKm: jarakKm.toFixed(1), durasiMenit, ongkos };
      const box = document.getElementById('boxEstimasi');
      box.style.display='block';
      box.innerHTML = `<b>Estimasi Perjalanan</b><br>📏 Jarak: ${jarakKm.toFixed(1)} km<br>⏱️ Waktu: ${durasiMenit} menit<br>💰 Ongkos: Rp ${ongkos.toLocaleString('id-ID')}`;
    }
  }catch(e){}
}

// ===== 5. BARU: ORDER NOW + CEK DATABASE =====
function orderNow(){
  const pickup = document.getElementById('pickup').value.trim();
  const tujuan = document.getElementById('tujuan').value.trim();
  if(!pickup || !tujuan){ alert('Isi dulu penjemputan & tujuan Bro!'); return; }
  if(!window._orderData) window._orderData = { pickup, tujuan, pickupCoord, tujuanCoord, jarakKm:0, durasiMenit:0, ongkos:0 };

  // SIMPAN DULU - BIAR GAK HILANG PAS DAFTAR
  localStorage.setItem('masphus_order', JSON.stringify(window._orderData));
  localStorage.setItem('masphus_order_pending', '1');

  // CEK AKUN DI DATABASE
  // Ganti bagian ini dengan cek Supabase / API lu yang asli:
  // Contoh: const user = await supabase.from('penumpang').select('*').eq('no_wa', no_wa).single()
  const userTersimpan = localStorage.getItem('masphus_user'); // ini wakil dari database, nanti ganti API
  const sudahPunyaAkun = !!userTersimpan;

  if(sudahPunyaAkun){
    // PELANGGAN LAMA -> LANGSUNG KE PENUMPANG
    window.location.href = 'penumpang.html';
  } else {
    // BARU -> DAFTAR DULU, DATA UDAH TERSIMPAN
    // Abis daftar, daftar.html WAJIB balik ke penumpang.html otomatis
    window.location.href = 'daftar.html';
  }
}

isiPenjemputanOtomatis();
</script>
</body>
</html>
