<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ammo Travel - Super Admin</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
  body{background:#f2f2f2}
  .layout{
    display:grid;
    grid-template-columns: 230px 280px 1fr;
    grid-template-rows: auto auto auto;
    gap:18px;
    padding:18px;
    min-height:100vh;
    align-items:stretch;
  }
  /* SIDEBAR KIRI MENTOK */
  .sidebar{
    grid-row:1 / 4; background:#0a0a0a; border-radius:18px;
    padding:22px 0; color:#e8c15a; display:flex; flex-direction:column;
  }
  .logo{padding:0 20px 22px; font-size:20px; font-weight:800; display:flex; gap:10px; align-items:center}
  .logo span{width:38px;height:38px;background:#e8c15a;border-radius:10px;display:grid;place-items:center;font-size:20px;color:#000}
  .menu{padding:14px 20px; display:flex; gap:12px; align-items:center; font-weight:600; cursor:pointer}
  .menu.active{background:#e8c15a;color:#000;border-radius:0 12px 12px 0;margin-right:12px}
  .menu i{font-size:18px}
  .user{margin-top:auto;padding:16px 20px;display:flex;gap:10px;align-items:center;border-top:1px solid #222}
  .user b{color:#fff}.user small{color:#999}

  /* KOTAK UMUM */
  .black{background:#0a0a0a;color:#e8c15a;border:2px solid #e8c15a;border-radius:16px;padding:18px;display:flex;flex-direction:column;justify-content:space-between}
  .white{background:#fff;border:1.5px solid #e8c15a;border-radius:16px;padding:18px}
  .btn-row{display:flex;gap:10px;margin-top:12px}
  .btn{flex:1;padding:10px;border-radius:10px;font-weight:800;cursor:pointer;text-align:center;border:none}
  .btn-acc{background:#e8c15a;color:#000}
  .btn-tolak{background:#111;color:#e8c15a;border:1px solid #e8c15a}

  /* DEBET TENGAH - 3 KOTAK, SEJAJAR DENGAN KANAN */
  .debet{grid-column:2}
  .debet h3{font-size:14px;opacity:.9}
  .debet .nominal{font-size:28px;font-weight:900;margin:6px 0}
  .debet small{color:#ccc;font-size:12px}

  /* KANAN */
